<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>AFRAB Operations</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --border:#334155; --text:#e2e8f0;
    --dim:#94a3b8; --accent:#33a7b5; --accent2:#7fbbe3;
    --green:#22c55e; --orange:#f59e0b; --red:#ef4444; --purple:#8b5cf6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100%}
  .screen{display:none;padding:16px 16px 70px 16px}
  .screen.active{display:block}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:10px}
  header img{flex-shrink:0}
  h1{font-size:20px;margin:0;color:var(--accent)}
  h2{font-size:16px;margin:20px 0 10px 0;color:var(--accent)}
  .role-pill{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
  .modules{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .module{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 14px;text-align:left;cursor:pointer;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;color:var(--text)}
  .module:active{transform:scale(.97)}
  .module .icon{font-size:26px}
  .module .label{font-size:14px;font-weight:600;margin-top:10px}
  .module .sub{font-size:11px;color:var(--dim);margin-top:4px}
  .module.packing{border-color:#2563eb}.module.filling{border-color:#14b8a6}
  .module.receipt{border-color:#f59e0b}.module.batch{border-color:#8b5cf6}
  .module.shrink{border-color:#ec4899}.module.coding{border-color:var(--green)}
  .module.weighing{border-color:var(--accent)}.module.admin{border-color:#64748b}
  .module.dashboard{border-color:#facc15}
  .product-item{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
  .product-item:active{background:#273449}
  .product-item .code{color:var(--dim);font-size:12px;font-family:monospace}
  .product-item .name{font-size:14px;margin-top:4px}
  .search{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:15px;color:var(--text);margin-bottom:12px}
  .search:focus{outline:none;border-color:var(--accent)}
  .back-btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text);font-size:13px;cursor:pointer;margin-bottom:16px}
  .action-btn{background:var(--accent);color:white;border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;margin-right:8px;margin-bottom:8px}
  .action-btn.alt{background:#475569}.action-btn.green{background:var(--green)}
  .action-btn.red{background:var(--red)}.action-btn.orange{background:var(--orange)}.action-btn.purple{background:var(--purple)}
  .empty{text-align:center;padding:40px 20px;color:var(--dim);font-size:14px;line-height:1.6}
  .loading{text-align:center;padding:40px 20px;color:var(--dim)}
  .status-bar{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--border);padding:10px 16px;font-size:12px;color:var(--dim);display:flex;justify-content:space-between;z-index:10}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px}
  .dot.offline{background:var(--red)}
  .material-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;border-left:5px solid var(--green);position:relative}
  .material-card.warn{border-left-color:var(--orange)}
  .material-card.danger{border-left-color:var(--red)}
  .material-card.expired{border-left-color:#475569;opacity:0.7}
  .material-card.done{opacity:0.5;border-left-color:#475569}
  .material-card.ticked{border-left-color:var(--accent2);box-shadow:0 0 0 2px var(--accent2) inset}
  .mat-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
  .mat-code{font-family:monospace;color:var(--dim);font-size:12px}
  .mat-name{font-size:15px;font-weight:600;margin:4px 0 10px 0}
  .mat-detail{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
  .mat-label{color:var(--dim)}
  .mat-value{color:var(--text);font-family:monospace}
  .tick-btn{background:transparent;border:2px solid var(--dim);color:var(--dim);border-radius:50%;width:34px;height:34px;font-size:16px;font-weight:700;cursor:pointer;flex-shrink:0}
  .tick-btn.on{background:var(--green);border-color:var(--green);color:white}
  .mark-btn{background:transparent;border:1px solid var(--red);color:var(--red);border-radius:6px;padding:6px 10px;font-size:11px;cursor:pointer;margin-top:10px}
  .unmark-btn{background:transparent;border:1px solid var(--green);color:var(--green);border-radius:6px;padding:6px 10px;font-size:11px;cursor:pointer;margin-top:10px}
  .alert-pill{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;margin-top:8px}
  .alert-pill.ok{background:#14532d;color:#86efac}
  .alert-pill.warn{background:#78350f;color:#fdba74}
  .alert-pill.danger{background:#7f1d1d;color:#fecaca}
  .alert-pill.expired{background:#374151;color:#cbd5e1}
  .info-banner{background:#1e3a5f;border:1px solid var(--accent);border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:14px;color:#bae6fd}
  .err-banner{background:#7f1d1d;border:1px solid var(--red);border-radius:10px;padding:12px 14px;font-size:12px;margin-bottom:14px;color:#fecaca;font-family:monospace;white-space:pre-wrap;word-break:break-all}
  .ok-banner{background:#14532d;border:1px solid var(--green);border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:14px;color:#86efac}
  .field{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--text);margin-bottom:10px}
  .field-label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
  .entry-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
  .entry-card h4{margin:0 0 12px 0;color:var(--accent);font-size:14px;display:flex;justify-content:space-between;align-items:center}
  .entry-row{margin-bottom:10px}
  .entry-row label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
  .entry-row input,.entry-row select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:14px;color:var(--text)}
  .picker-btn{width:100%;background:#1e3a5f;border:1px solid var(--accent);color:var(--text);border-radius:8px;padding:10px;font-size:14px;text-align:left;cursor:pointer}
  .remove-btn{background:transparent;border:1px solid var(--red);color:var(--red);border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer}
  .session-banner{background:#312e81;border:1px solid #6366f1;border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:14px;color:#c7d2fe}
  .batch-pill{display:inline-block;background:var(--purple);color:#fff;padding:4px 10px;border-radius:20px;font-size:13px;font-family:monospace;font-weight:700}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .stat-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px}
  .stat-card .stat-label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:0.5px}
  .stat-card .stat-value{font-size:22px;font-weight:700;color:var(--text);margin-top:6px}
  .stat-card .stat-sub{font-size:11px;color:var(--dim);margin-top:4px}
  .stat-card.accent{border-color:var(--accent)}
  .stat-card.green{border-color:var(--green)}
  .stat-card.orange{border-color:var(--orange)}
  .stat-card.purple{border-color:var(--purple)}
  .list-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
  .list-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
  .list-row:last-child{border-bottom:none}
  .list-row .name{color:var(--text)}
  .list-row .num{font-family:monospace;color:var(--accent2);font-weight:700}

  /* LOGIN */
  .login-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;padding:20px}
  .login-wrap img{height:80px;width:80px;border-radius:18px;margin-bottom:16px}
  .login-title{font-size:22px;color:var(--accent);margin-bottom:6px;text-align:center}
  .login-sub{font-size:13px;color:var(--dim);margin-bottom:28px;text-align:center}
  .login-input{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;font-size:16px;color:var(--text);margin-bottom:12px}
  .login-input:focus{outline:none;border-color:var(--accent)}
  .login-btn{width:100%;max-width:360px;background:var(--accent);color:white;border:none;border-radius:10px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px}
  .login-btn:disabled{opacity:.5;cursor:not-allowed}
  .login-err{color:#fecaca;background:#7f1d1d;border:1px solid var(--red);border-radius:8px;padding:12px;font-size:13px;width:100%;max-width:360px;margin-bottom:16px;text-align:center}

  .user-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);gap:8px}
  .user-row:last-child{border-bottom:none}
  .user-row .uinfo{flex:1}
  .user-row .uname{font-size:14px;font-weight:600}
  .user-row .umeta{font-size:11px;color:var(--dim);margin-top:2px}
  .user-row .inactive{opacity:.5}

  @media print {
    body { background: white; color: black; }
    .screen, .status-bar, .back-btn { display: none !important; }
    .print-only { display: block !important; padding: 20px; color: black; }
    .print-header { border-bottom: 3px solid #ff0000; padding-bottom: 12px; margin-bottom: 20px; display: flex; align-items: center; gap: 16px; }
    .print-header img { height: 60px; }
    .print-header h1 { font-size: 22px; margin: 0 0 6px 0; color: #ff0000; }
    .print-header .addr { font-size: 13px; line-height: 1.5; color: black; }
    .print-title { font-size: 18px; font-weight: bold; text-align: center; margin: 20px 0; text-transform: uppercase; color: #ff0000; }
    .print-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px; margin-bottom: 20px; }
    .print-meta b { display: inline-block; min-width: 100px; }
    .print-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 20px; }
    .print-table th, .print-table td { border: 1px solid #000; padding: 6px 8px; text-align: left; vertical-align: top; }
    .print-table th { background: #fff5f5; font-weight: bold; color: #ff0000; }
    .print-sign { display: flex; justify-content: space-between; margin-top: 40px; font-size: 13px; }
    .print-sign div { border-top: 1px solid #000; width: 40%; padding-top: 4px; }
  }
  .print-only { display: none; }
</style>
</head>

    <div class="login-title">AFRAB Operations</div>

<div class="status-bar">

  <span id="status-text">Ready</span>
</div>

<div id="print-area" class="print-only"></div>

<script>
// ============================================================
// CONFIG
// ============================================================
const SPREADSHEET_ID = "1mwo5IXXrIu4bnqR8GOV1qNxQ31rdfdUjeLfBQf22t1M";
const API_BASE = "https://script.google.com/macros/s/AKfycbwKkCOGWDXDDtD_bpUeqS99S4ytOYUpcq8n4gOPImZu4e45WCuGOH2ZNv0gIgwJE0NjDw/exec";
const AUTH_KEY = "afrab.auth.v1";

const SHEETS = { products:"Drug database", raw_materials:"raw_materials", bom:"bom", machines:"machines", operators:"operators" };
const RECEIPT_SHEET = "receipt_log", RECEIPT_STORAGE = "afrab.receipt.pending";
const BATCH_REGISTRY_SHEET = "batch_registry", BATCH_STORAGE = "afrab.batch.pending";
const WEIGHING_SHEET = "weighing_log", WEIGHING_STORAGE = "afrab.weighing.pending";

const FILLING_LINES = ["100ml line (FL 2)","15ml drops line (FL1)","Ibuprofen Line (FL3)","Manual Line","External","Antibiotics"];

const ROLE_LABELS = {
  packing:"Packing Supervisor", filling:"Filling Supervisor", receipt:"Product Receiver",
  batch:"Production Batch", shrink:"Label / Shrinkwrap", coding:"Coding Supervisor",
  weighing:"Weighing Staff", admin:"Admin"
};

// ============================================================
// AUTH STATE
// ============================================================
function getAuth(){ try { return JSON.parse(localStorage.getItem(AUTH_KEY)) || null; } catch(e) { return null; } }
function setAuth(a){ localStorage.setItem(AUTH_KEY, JSON.stringify(a)); }
function clearAuth(){ localStorage.removeItem(AUTH_KEY); }
function getToken(){ const a = getAuth(); return a ? a.token : ""; }
function isAdmin(){ const a = getAuth(); return a && a.role === "admin"; }

// ============================================================
// TEMPLATES
// ============================================================
const TEMPLATES = {
  shrinkwrap: {
    title:"Shrinkwrap", sheetName:"shrinkwrap_log", storageKey:"afrab.shrink.pending",
    fields:[
      { key:"batch_no", label:"Batch No", type:"text", placeholder:"e.g. 26001" },
      { key:"machine",  label:"Machine",  type:"picker", source:"machines",  allowCustom:true },
      { key:"operator", label:"Operator", type:"picker", source:"operators", allowCustom:true },
      { key:"qty",      label:"Quantity Shrinkwrapped", type:"number", placeholder:"e.g. 500" },
    ],
    toRow:(date,e)=>({ "Date":date, "Product":e.product, "Product Code":e.productCode, "Batch No":e.batch_no, "Machine":e.machine, "Operator":e.operator, "Quantity":e.qty, "Saved At":new Date().toISOString() }),
  },
  coding: {
    title:"Coding", sheetName:"coding_log", storageKey:"afrab.coding.pending",
    fields:[
      { key:"batch_no", label:"Batch No", type:"text", placeholder:"e.g. 26001" },
      { key:"machine",  label:"Machine",  type:"picker", source:"machines",  allowCustom:true },
      { key:"operator", label:"Operator", type:"picker", source:"operators", allowCustom:true },
      { key:"qty",      label:"Quantity Coded", type:"number", placeholder:"e.g. 500" },
    ],
    toRow:(date,e)=>({ "Date":date, "Product":e.product, "Product Code":e.productCode, "Batch No":e.batch_no, "Machine":e.machine, "Operator":e.operator, "Quantity":e.qty, "Saved At":new Date().toISOString() }),
  },
  packing: {
    title:"Packing", sheetName:"packing_log", storageKey:"afrab.packing.pending",
    fields:[
      { key:"batch_no",   label:"Batch No",   type:"text",   placeholder:"e.g. 26001" },
      { key:"batch_size", label:"Batch Size", type:"number", placeholder:"e.g. 5000" },
      { key:"packers",    label:"No of Packers", type:"number", placeholder:"e.g. 5" },
      { key:"output",     label:"Output",     type:"number", placeholder:"e.g. 4800" },
    ],
    toRow:(date,e)=>({ "Date":date, "Product":e.product, "Product Code":e.productCode, "Batch No":e.batch_no, "Batch Size":e.batch_size, "No of Packers":e.packers, "Output":e.output, "Saved At":new Date().toISOString() }),
  },
  filling: {
    title:"Filling", sheetName:"filling_log", storageKey:"afrab.filling.pending",
    fields:[
      { key:"batch_no",        label:"Batch No",            type:"text",   placeholder:"e.g. 26001" },
      { key:"filling_line",    label:"Filling Line",        type:"picker", source:"filling_lines", allowCustom:false },
      { key:"no_personnel",    label:"No of Personnel",     type:"number", placeholder:"e.g. 8" },
      { key:"output",          label:"Daily Output",        type:"number", placeholder:"e.g. 4500" },
      { key:"downtime",        label:"Machine Downtime",    type:"text",   placeholder:"HH:MM:SS  e.g. 1:55:15" },
      { key:"downtime_reason", label:"Downtime Reason",     type:"text",   placeholder:"e.g. None / Maintenance" },
    ],
    toRow:(date,e)=>({ "Date":date, "Product":e.product, "Product Code":e.productCode, "Batch No":e.batch_no, "Filling Line":e.filling_line, "No of Personnel":e.no_personnel, "Daily Output":e.output, "Machine Downtime":e.downtime, "Downtime Reason":e.downtime_reason, "Saved At":new Date().toISOString() }),
  },
};

// ============================================================
// COMPANY
// ============================================================
const COMPANY_DEFAULT = { name:"AFRAB CHEM LIMITED", address:"Lagos, Nigeria", phone:"+234 806 521 1837", email:"info@afrabchem.com" };
function getCompany(){ try { return JSON.parse(localStorage.getItem("afrab.company")) || COMPANY_DEFAULT; } catch(e) { return COMPANY_DEFAULT; } }
function saveCompany(c){ localStorage.setItem("afrab.company", JSON.stringify(c)); }

// ============================================================
// FINISHED MATERIALS
// ============================================================
function getFinishedKey(code, qc){ return "afrab.finished." + code + "|" + (qc||""); }
function isLocallyFinished(code, qc){ return localStorage.getItem(getFinishedKey(code, qc)) === "1"; }
function markFinished(code, qc){ localStorage.setItem(getFinishedKey(code, qc), "1"); }
function unmarkFinished(code, qc){ localStorage.removeItem(getFinishedKey(code, qc)); }

// ============================================================
// PENDING QUEUE
// ============================================================
function getPending(k){ try { return JSON.parse(localStorage.getItem(k)) || []; } catch(e) { return []; } }
function savePending(k, l){ localStorage.setItem(k, JSON.stringify(l)); }

// ============================================================
// HELPERS
// ============================================================
function makeReference(){
  const d = new Date();
  return "REC-" + d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + "-" + String(d.getHours()).padStart(2,'0') + String(d.getMinutes()).padStart(2,'0');
}
function yearPrefix(){ return String(new Date().getFullYear()).slice(-2); }
function nextBatchNumber(registry){
  const prefix = yearPrefix();
  let maxSeq = 0;
  (registry || []).forEach(row => {
    const bn = String(row["Batch No"] || "").trim();
    if (bn.startsWith(prefix) && bn.length >= 5) {
      const seq = parseInt(bn.slice(2), 10);
      if (!isNaN(seq) && seq > maxSeq) maxSeq = seq;
    }
  });
  return prefix + String(maxSeq + 1).padStart(3, '0');
}
function currentMonthString(){ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,'0'); }
function todayString(){ return new Date().toISOString().slice(0,10); }
function parseYMD(s){
  if (!s) return null;
  let m = String(s).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = String(s).match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if (m) return new Date(+m[3], +m[2]-1, +m[1]);
  const d = new Date(s); return isNaN(d) ? null : d;
}
function downtimeToHours(s){
  if (!s) return 0;
  const parts = String(s).split(":").map(x => parseInt(x,10)||0);
  while (parts.length < 3) parts.push(0);
  return parts[0] + parts[1]/60 + parts[2]/3600;
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// ============================================================
// STATE
// ============================================================
const state = {
  auth: null,
  role: null,
  products: [], rawMaterials: [], bom: [], machines: [], operators: [],
  currentProduct: null,
};

const MODULES = {
  packing:{ title:"Packing Entry", sub:"Daily packer output", color:"packing" },
  filling:{ title:"Filling Entry", sub:"Filling line production", color:"filling" },
  receipt:{ title:"Product Receipt", sub:"Receive finished products", color:"receipt" },
  batch:{ title:"Production Batch", sub:"Track batch by year", color:"batch" },
  shrink:{ title:"Shrink Wrapping", sub:"Per machine, per day", color:"shrink" },
  coding:{ title:"Coding", sub:"Per coder, per batch", color:"coding" },
  weighing:{ title:"Weighing", sub:"Raw materials for a batch", color:"weighing" },
  admin:{ title:"Admin", sub:"Products, machines, users", color:"admin" },
  dashboard:{ title:"Dashboard", sub:"Today & month totals", color:"dashboard" },
};
const ROLE_MODULES = {
  packing:["packing"], filling:["filling"], receipt:["receipt"],
  batch:["batch"], shrink:["shrink"], coding:["coding"], weighing:["weighing"],

function init(){
  handleAuthRedirectFromHash();
  const auth = getAuth();
  if (auth && auth.token && auth.exp > Date.now()) {
    state.auth = auth;
    state.role = auth.role;
    showHome();
  } else {
    clearAuth();
    showLogin();
  }
  updateNet();
  scheduleAutoSync();
}

function handleAuthRedirectFromHash(){
  const hash = location.hash || "";
  if (!hash || hash.length < 2) return;

  // Strip leading #
  const params = new URLSearchParams(hash.slice(1));

  if (params.has("auth")) {
    const token = params.get("auth");
    const username = params.get("u") || "";
    const name = params.get("n") || "";
    const role = (params.get("r") || "").toLowerCase();
    // Decode token to get expiry
    let exp = Date.now() + 30*24*60*60*1000;
    try {
      const b64 = token.split(".")[0];
      const json = atob(b64.replace(/-/g,"+").replace(/_/g,"/"));
      const payload = JSON.parse(json);
      if (payload.exp) exp = payload.exp;
    } catch(e) {}
    setAuth({ token, username, name, role, exp });
    history.replaceState(null, "", location.pathname + location.search);
  } else if (params.has("auth-error")) {
    sessionStorage.setItem("afrab.loginError", params.get("auth-error"));
    history.replaceState(null, "", location.pathname + location.search);
  }
}

function showLogin(){
  const err = sessionStorage.getItem("afrab.loginError");
  sessionStorage.removeItem("afrab.loginError");
  const box = document.getElementById("loginErrBox");
  box.innerHTML = err ? `<div class="login-err">${esc(err)}</div>` : "";
  document.getElementById("li-user").value = "";
  document.getElementById("li-pass").value = "";
  document.getElementById("li-btn").disabled = false;
  document.getElementById("li-btn").textContent = "Sign In";
  showScreen("screen-login");
}

function doLogin(){
  const user = document.getElementById("li-user").value.trim().toLowerCase();
  const pass = document.getElementById("li-pass").value;
  if (!user || !pass) {
    document.getElementById("loginErrBox").innerHTML = `<div class="login-err">Enter username and passcode</div>`;
    return;
  }
  document.getElementById("li-btn").disabled = true;
  document.getElementById("li-btn").textContent = "Signing in…";

  // Full-page form POST to Apps Script
  const form = document.createElement("form");
  form.method = "POST";
  form.action = API_BASE;
  form.style.display = "none";
  const mk = (n,v) => { const i = document.createElement("input"); i.type="hidden"; i.name=n; i.value=v; form.appendChild(i); };
  mk("action", "login");
  mk("username", user);
  mk("passcode", pass);
  document.body.appendChild(form);
  form.submit();
}

function doLogout(){
  if (!confirm("Log out?")) return;
  clearAuth();
  state.auth = null;
  state.role = null;
  state.products = []; state.rawMaterials = []; state.bom = []; state.machines = []; state.operators = [];

// ============================================================
const fetchLog = {};
function fetchSheet(sheetName){
  return new Promise((resolve, reject) => {
    const cb = "gviz_cb_" + Math.random().toString(36).slice(2);
    let done = false, script = null;
    const cleanup = () => { if (done) return; done = true; try { delete window[cb]; } catch(e){} if (script && script.parentNode) script.parentNode.removeChild(script); };
    const timer = setTimeout(() => { cleanup(); fetchLog[sheetName] = "TIMEOUT"; reject(new Error("Timeout")); }, 20000);
    window[cb] = function(data){
      clearTimeout(timer);
      try {
        if (!data || data.status !== "ok" || !data.table) { fetchLog[sheetName] = "Bad response"; cleanup(); reject(new Error("Invalid response")); return; }
        const rawRows = (data.table.rows || []).map(row => (row.c || []).map(cell => {
          if (!cell) return "";
          if (cell.f !== undefined && cell.f !== null) return String(cell.f);
          if (cell.v !== undefined && cell.v !== null) return String(cell.v);
          return "";
        }));
        const cols = (data.table.cols || []).map(c => String(c.label || "").trim());
        const haveLabels = cols.length > 0 && cols.some(l => l && /[a-z]/i.test(l));
        let headers, dataRows;
        if (haveLabels) { headers = cols; dataRows = rawRows; }
        else { const copy = rawRows.slice(); headers = (copy.shift() || []).map(h => String(h).trim()); dataRows = copy; }
        const rows = dataRows.map(r => { const obj = {}; headers.forEach((h, i) => { if (h) obj[h] = r[i] || ""; }); return obj; });
        fetchLog[sheetName] = "OK rows=" + rows.length;
        cleanup(); resolve(rows);
      } catch(err){ cleanup(); fetchLog[sheetName] = "Parse error"; reject(err); }
    };
    const url = "https://docs.google.com/spreadsheets/d/" + SPREADSHEET_ID + "/gviz/tq?sheet=" + encodeURIComponent(sheetName) + "&tqx=out:json;responseHandler:" + cb;
    script = document.createElement("script");
    script.src = url;
    script.onerror = () => { clearTimeout(timer); fetchLog[sheetName] = "Script load failed"; cleanup(); reject(new Error("Script load failed")); };
    document.head.appendChild(script);
  });
}
async function safeFetch(sheetName){ try { return await fetchSheet(sheetName); } catch(e){ return []; } }

// ============================================================
// WRITE VIA NEW-TAB (now with token)
// ============================================================
function buildWriteUrl(sheetName, rows){
  const token = getToken();
  return API_BASE + "?action=append&sheet=" + encodeURIComponent(sheetName) +
         "&token=" + encodeURIComponent(token) +
         "&rows=" + encodeURIComponent(JSON.stringify(rows));
}
async function postRows(sheetName, rows){
  if (!rows || !rows.length) return false;
  const url = buildWriteUrl(sheetName, rows);
  try {
    const w = window.open(url, "_blank", "width=80,height=80,left=-1000,top=-1000");
    if (w && !w.closed) { await new Promise(r => setTimeout(r, 2500)); try { w.close(); } catch(e){} return true; }
  } catch(e){}
  try { await fetch(url, {method:"GET", mode:"no-cors", redirect:"manual", cache:"no-store"}); await new Promise(r => setTimeout(r, 1500)); return true; } catch(e){}
  return false;
}
async function syncPending(sheetName, storageKey){
  const pending = getPending(storageKey);
  if (!pending.length) return { sent:0, remaining:0 };
  setStatus(`Sending ${pending.length}…`);
  const ok = await postRows(sheetName, pending);
  if (ok) { savePending(storageKey, []); setStatus(`Sent ${pending.length}`); return { sent: pending.length, remaining: 0 }; }
  setStatus(`Send failed (${pending.length} kept)`);
  return { sent: 0, remaining: pending.length };
}
async function syncTemplate(tpl){ return syncPending(tpl.sheetName, tpl.storageKey); }
async function autoSyncAll(){
  if (!navigator.onLine) return;
  if (!getAuth()) return;
  for (const key of Object.keys(TEMPLATES)) await syncTemplate(TEMPLATES[key]);
  await syncPending(RECEIPT_SHEET, RECEIPT_STORAGE);
  await syncPending(BATCH_REGISTRY_SHEET, BATCH_STORAGE);
  await syncPending(WEIGHING_SHEET, WEIGHING_STORAGE);
}
function scheduleAutoSync(){ setTimeout(autoSyncAll, 5000); setInterval(autoSyncAll, 120000); }

function findKey(obj, ...keywords){
  if (!obj) return null;
  const keys = Object.keys(obj);
  for (const k of keywords){
    const found = keys.find(kk => kk.toLowerCase().includes(k.toLowerCase()));
    if (found) return found;
  }
  return null;
}

async function loadProducts(){
  if (state.products.length) return state.products;
  const rows = await fetchSheet(SHEETS.products);
  if (!Array.isArray(rows) || !rows.length) return [];
  const sample = rows[0];
  const kCode = findKey(sample, "product code", "code");
  const kName = findKey(sample, "product name", "name");
  const kActive = findKey(sample, "active");
  state.products = rows
    .filter(x => x[kCode] && String(x[kCode]).trim())
    .filter(x => !kActive || String(x[kActive]||"").trim().toUpperCase() !== "NO")
    .map(x => ({ code:String(x[kCode]).trim(), name:String(x[kName]||"").trim() }));
  return state.products;
}
async function loadRawMaterials(){
  if (state.rawMaterials.length) return state.rawMaterials;
  try {
    const rows = await fetchSheet(SHEETS.raw_materials);
    if (!Array.isArray(rows) || !rows.length) return [];
    const sample = rows[0];
    const kCode = findKey(sample, "material code");
    const kName = findKey(sample, "material name");
    const kBatch = findKey(sample, "batch no","batch","lot");
    const kQC = findKey(sample, "qc");
    const kMFG = findKey(sample, "mfg","manufactur");
    const kEXP = findKey(sample, "expir","exp");
    const kStat = findKey(sample, "status");
    state.rawMaterials = rows
      .filter(x => x[kCode] && String(x[kCode]).trim())
      .map(x => ({ code:String(x[kCode]||"").trim(), name:String(x[kName]||"").trim(), batch:kBatch?String(x[kBatch]||"").trim():"", qc:String(x[kQC]||"").trim(), mfg:String(x[kMFG]||"").trim(), exp:String(x[kEXP]||"").trim(), status:kStat?String(x[kStat]||"").trim():"Active" }));
  } catch(e){ state.rawMaterials = []; }
  return state.rawMaterials;
}
async function loadBOM(){
  if (state.bom.length) return state.bom;
  try {
    const rows = await fetchSheet(SHEETS.bom);
    if (!Array.isArray(rows) || !rows.length) return [];
    const sample = rows[0];
    const kProd = findKey(sample, "product code");
    const kMat = findKey(sample, "material code");
    state.bom = rows.filter(x => x[kProd] && x[kMat]).map(x => ({ product:String(x[kProd]).trim(), material:String(x[kMat]).trim() }));
  } catch(e){ state.bom = []; }
  return state.bom;
}
async function loadMachines(){
  if (state.machines.length) return state.machines;
  const DEFAULTS = ["Machine 1","Machine 2","Machine 3"];
  try {
    const rows = await fetchSheet(SHEETS.machines);
    if (Array.isArray(rows) && rows.length) {
      const sample = rows[0];
      const kName = Object.keys(sample).find(k => k.toLowerCase() === "machine name");
      const kActive = Object.keys(sample).find(k => k.toLowerCase() === "active");
      if (kName) {
        state.machines = rows.filter(x => x[kName] && String(x[kName]).trim())
          .filter(x => !kActive || String(x[kActive]||"").trim().toUpperCase() !== "NO")
          .filter(x => !/^FP\d+/i.test(String(x[kName]).trim()))
          .map(x => ({ name:String(x[kName]||"").trim() }));
      }
    }
  } catch(e){}
  if (state.machines.length === 0) state.machines = DEFAULTS.map(n => ({ name:n }));
  return state.machines;
}
async function loadOperators(){
  if (state.operators.length) return state.operators;
  try {
    const rows = await fetchSheet(SHEETS.operators);
    if (Array.isArray(rows) && rows.length) {
      const sample = rows[0];
      const kName = Object.keys(sample).find(k => k.toLowerCase() === "operator name");
      const kActive = Object.keys(sample).find(k => k.toLowerCase() === "active");
      if (kName) {
        state.operators = rows.filter(x => x[kName] && String(x[kName]).trim())
          .filter(x => !kActive || String(x[kActive]||"").trim().toUpperCase() !== "NO")
          .filter(x => !/^FP\d+/i.test(String(x[kName]).trim()))
          .map(x => ({ name:String(x[kName]||"").trim() }));
      }
    }
  } catch(e){}
  return state.operators;
}

// Generic iframe+postMessage call to Apps Script
function postToAppsScript(action, params){
  return new Promise((resolve, reject) => {
    const frameName = "afrabFrame_" + Math.random().toString(36).slice(2);
    const iframe = document.createElement("iframe");
    iframe.name = frameName;
    iframe.style.cssText = "position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;border:0";
    document.body.appendChild(iframe);

    let done = false;
    const cleanup = () => {
      if (done) return; done = true;
      window.removeEventListener("message", handler);
      try { document.body.removeChild(iframe); } catch(e){}
      try { document.body.removeChild(form); } catch(e){}
    };
    const handler = (event) => {
      if (event.origin !== "https://script.google.com") return;
      if (!event.data || !event.data.afrab) return;
      cleanup();
      resolve(event.data.afrab);
    };
    window.addEventListener("message", handler);

    const form = document.createElement("form");
    form.method = "POST";
    form.action = API_BASE;
    form.target = frameName;
    form.style.display = "none";
    const mk = (n,v) => { const i = document.createElement("input"); i.type="hidden"; i.name=n; i.value=v; form.appendChild(i); };
    mk("action", action);
    mk("token", getToken());
    Object.keys(params || {}).forEach(k => mk(k, params[k]));
    document.body.appendChild(form);
    form.submit();

    setTimeout(() => { if (!done) { cleanup(); reject(new Error("Request timeout")); } }, 20000);
  });
}

    const productsWithBOM = new Set(bom.map(x => x.product));
    c.innerHTML = `
      <div class="info-banner">${productsWithBOM.size} of ${products.length} products have a BOM.</div>
      <input class="search" id="w-search" placeholder="Search product…"/>
      <div id="w-list"></div>`;
    const render = (q="") => {
      const list = document.getElementById("w-list");
      const query = q.trim().toLowerCase();
      const items = query ? products.filter(x => x.name.toLowerCase().includes(query) || x.code.toLowerCase().includes(query)) : products;
      if (!items.length) { list.innerHTML = `<div class="empty">No products match.</div>`; return; }
      list.innerHTML = items.map(p => {
        const hasBOM = productsWithBOM.has(p.code);
        const badge = hasBOM ? `<span style="color:var(--green);font-size:11px">● BOM ready</span>` : `<span style="color:var(--dim);font-size:11px">● no BOM</span>`;
        return `<div class="product-item" onclick="showWeighingForProduct('${esc(p.code)}')">
          <div class="code">${esc(p.code)} &nbsp; ${badge}</div>
          <div class="name">${esc(p.name)}</div>
        </div>`;
      }).join("");
    };
    render();
    document.getElementById("w-search").addEventListener("input", e => render(e.target.value));
  } catch(err){
    c.innerHTML = `<div class="err-banner">Failed: ${esc(err.message)}</div>
      <button class="back-btn" onclick="goHome()">← Back</button>`;
  }
}

async function showWeighingForProduct(productCode){
  const c = document.getElementById("module-content");
  const product = state.products.find(p => p.code === productCode);
  state.currentProduct = product;
  const bomItems = state.bom.filter(b => b.product === productCode);
  const today = new Date();

  const [registry] = await Promise.all([ safeFetch(BATCH_REGISTRY_SHEET) ]);
  const productBatches = (registry || []).filter(r => String(r["Product Code"]||"").trim() === productCode);
  const suggestedBatch = productBatches.length ? String(productBatches[productBatches.length-1]["Batch No"]||"").trim() : nextBatchNumber(registry);

  let sessionBatch = suggestedBatch;
  let sessionStaff = localStorage.getItem("afrab.lastweigher") || "";
  const ticked = {};

  const renderPage = () => {
    const materials = bomItems.map(b => {
      const all = state.rawMaterials.filter(r => r.code === b.material);
      const enriched = all.map(r => ({ ...r, sheetFinished:(r.status||"").trim().toLowerCase() === "finished", localFinished:isLocallyFinished(r.code, r.qc) }));
      const active = enriched.filter(r => !r.sheetFinished && !r.localFinished);
      const finishedList = enriched.filter(r => r.sheetFinished || r.localFinished);
      return { materialCode: b.material, active, finishedList, total: all.length };
    });

    function parseFlexibleDate(str, isExpiry){
      if (!str) return null;
      str = String(str).trim(); if (!str) return null;
      let m = str.match(/^(\d{4})[-\/](\d{1,2})([-\/](\d{1,2}))?$/);
      if (m){const y=+m[1],mo=+m[2]-1,d=m[4]?+m[4]:(isExpiry?new Date(y,mo+1,0).getDate():1);return new Date(y,mo,d);}
      m = str.match(/^(\d{1,2})[-\/\.](\d{1,2})[-\/\.](\d{4})$/);
      if (m){return new Date(+m[3],+m[2]-1,+m[1]);}
      m = str.match(/^(\d{1,2})[-\/](\d{4})$/);
      if (m){const mo=+m[1]-1,y=+m[2],d=isExpiry?new Date(y,mo+1,0).getDate():1;return new Date(y,mo,d);}
      const months = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
      m = str.match(/^([A-Za-z]{3,})[\s\-\/](\d{4})$/);
      if (m){const mo=months[m[1].slice(0,3).toLowerCase()];if(mo!==undefined){const y=+m[2],d=isExpiry?new Date(y,mo+1,0).getDate():1;return new Date(y,mo,d);}}
      const n = new Date(str); return isNaN(n)?null:n;
    }
    function daysUntil(s){ const d = parseFlexibleDate(s, true); if (!d) return null; return Math.floor((d - today)/86400000); }
    function statusFor(days){
      if (days === null) return { cls:"", label:"—", pill:"ok" };
      if (days < 0) return { cls:"expired", label:`EXPIRED ${Math.abs(days)}d ago`, pill:"expired" };
      if (days < 30) return { cls:"danger", label:`URGENT ${days}d`, pill:"danger" };
      if (days < 90) return { cls:"warn", label:`${days}d left`, pill:"warn" };
      return { cls:"", label:`${days}d left`, pill:"ok" };
    }

    let html = `
      <button class="back-btn" onclick="renderWeighingProductPicker()">← Products</button>
      <div style="background:var(--panel);border-radius:12px;padding:14px;margin-bottom:12px">
        <div style="font-family:monospace;color:var(--dim);font-size:12px">${esc(product.code)}</div>
        <div style="font-size:17px;font-weight:600;margin-top:4px">${esc(product.name)}</div>
      </div>
      <div class="session-banner">
        <div style="margin-bottom:10px"><b>📋 Weighing Session</b></div>
        <div class="entry-row"><label>Batch No being produced</label>
          <input id="wBatch" value="${esc(sessionBatch)}" placeholder="e.g. 26001" style="font-family:monospace;font-weight:700"/></div>
        <div class="entry-row" style="margin-bottom:0"><label>Weighed by (your name)</label>
          <input id="wStaff" value="${esc(sessionStaff)}" placeholder="Your name"/></div>
      </div>
      <button class="action-btn green" id="wPrintBOM" style="margin-bottom:14px">🖨️ Print BOM</button>`;

    if (materials.length === 0){
      html += `<div class="empty"><b>BOM not yet added for this product.</b></div>`;
      c.innerHTML = html;
      c.querySelector("#wPrintBOM").onclick = () => printBOM(productCode);
      c.querySelector("#wBatch").addEventListener("input", e => sessionBatch = e.target.value);
      c.querySelector("#wStaff").addEventListener("input", e => sessionStaff = e.target.value);
      return;
    }

    let tickedCount = 0;
    materials.forEach(m => { m.active.forEach(r => { const key = m.materialCode + "|" + r.qc + "|" + r.batch; if (ticked[key]) tickedCount++; }); });

    html += `<div style="font-size:12px;color:var(--dim);margin-bottom:8px">Materials needed — tap the circle ✓ after you weigh each one. ${tickedCount > 0 ? `<b style="color:var(--green)">${tickedCount} ticked</b>` : ""}</div>`;

    materials.forEach((m, idx) => {
      html += `<div style="margin-bottom:14px">
        <div style="color:var(--dim);font-size:11px;font-family:monospace;margin-bottom:4px">MATERIAL ${idx+1} of ${materials.length}</div>`;
      if (m.active.length === 0 && m.finishedList.length === 0) {
        html += `<div class="material-card expired"><div class="mat-code">${esc(m.materialCode)}</div>
          <div class="mat-name">Not in Raw Materials sheet</div></div>`;
      } else if (m.active.length === 0) {
        html += `<div class="material-card done"><div class="mat-code">${esc(m.materialCode)}</div>
          <div class="mat-name">✓ All batches finished (${m.finishedList.length})</div>
          <button class="unmark-btn" onclick="showFinishedBatch('${esc(m.materialCode)}')">Show finished</button></div>`;
      } else {
        m.active.forEach(rec => {
          const days = daysUntil(rec.exp);
          const st = statusFor(days);
          const safeCode = esc(rec.code), safeQc = esc(rec.qc||""), safeBatch = esc(rec.batch||"");
          const key = m.materialCode + "|" + (rec.qc||"") + "|" + (rec.batch||"");
          const isTicked = !!ticked[key];
          html += `<div class="material-card ${st.cls} ${isTicked?'ticked':''}">
            <div class="mat-row">
              <span class="mat-code">${safeCode}</span>
              <div style="display:flex;align-items:center;gap:8px">
                <span class="alert-pill ${st.pill}">${st.label}</span>
                <button class="tick-btn ${isTicked?'on':''}" data-tick="${esc(key)}">${isTicked?'✓':''}</button>
              </div>
            </div>
            <div class="mat-name">${esc(rec.name)}</div>
            <div class="mat-detail">
              <span class="mat-label">Batch No:</span><span class="mat-value">${safeBatch||"—"}</span>
              <span class="mat-label">QC No:</span><span class="mat-value">${safeQc||"—"}</span>
              <span class="mat-label">MFG Date:</span><span class="mat-value">${esc(rec.mfg||"—")}</span>
              <span class="mat-label">Expiry:</span><span class="mat-value">${esc(rec.exp||"—")}</span>
            </div>
            <button class="mark-btn" onclick="confirmMarkFinished('${safeCode}','${safeQc}','${safeBatch}')">Mark material as finished</button>
          </div>`;
        });
      }
      html += `</div>`;
    });

    html += `<div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border)">
        <button class="action-btn green" id="wConfirm" style="width:100%">✅ Confirm Weighing Session</button>
      </div>`;

    c.innerHTML = html;

    c.querySelector("#wBatch").addEventListener("input", e => sessionBatch = e.target.value);
    c.querySelector("#wStaff").addEventListener("input", e => sessionStaff = e.target.value);
    c.querySelector("#wPrintBOM").onclick = () => printBOM(productCode);
    c.querySelectorAll("[data-tick]").forEach(btn => {
      btn.onclick = () => {
        const key = btn.getAttribute("data-tick");
        if (ticked[key]) delete ticked[key]; else ticked[key] = true;
        renderPage();
      };
    });

    c.querySelector("#wConfirm").onclick = async () => {
      const bn = String(sessionBatch||"").trim();
      const who = String(sessionStaff||"").trim();
      if (!bn) { alert("Please enter the batch number being produced."); return; }
      if (!who) { alert("Please enter your name (Weighed by)."); return; }
      const tickedMaterials = [];
      materials.forEach(m => {
        m.active.forEach(r => {
          const key = m.materialCode + "|" + (r.qc||"") + "|" + (r.batch||"");
          if (ticked[key]) tickedMaterials.push({ code:r.code, qc:r.qc||"", batch:r.batch||"" });
        });
      });
      const compact = tickedMaterials.map(x => `${x.code}/${x.qc}/${x.batch}`).join("; ");
      const row = { "Date":todayString(), "Product":product.name, "Product Code":product.code, "Batch No":bn, "Weighed By":who, "Materials":compact, "Material Count":tickedMaterials.length, "Logged At":new Date().toISOString() };
      localStorage.setItem("afrab.lastweigher", who);
      const existing = getPending(WEIGHING_STORAGE);
      savePending(WEIGHING_STORAGE, existing.concat([row]));
      setStatus("Sending…");
      const r = await syncPending(WEIGHING_SHEET, WEIGHING_STORAGE);
      if (r.sent > 0) {
        alert(`✅ Weighing session logged.\n\nBatch ${bn}\n${tickedMaterials.length} material(s)\nWeighed by ${who}`);
        renderWeighingProductPicker();
      } else {
        alert(`⚠️ Saved on phone. It will auto-sync when online.`);
      }
    };
  };

  renderPage();
}

function confirmMarkFinished(code, qc, batch){
  const msg = `Mark this material batch as finished?\n\nMaterial: ${code}\nQC No: ${qc||"—"}\nBatch: ${batch||"—"}\n\nIt will be hidden from future weighing sessions.`;
  if (confirm(msg)) {
    markFinished(code, qc);
    setStatus("Marked finished");
    if (state.currentProduct) showWeighingForProduct(state.currentProduct.code);
  }
}
function showFinishedBatch(code){
  const records = state.rawMaterials.filter(r => r.code === code);
  if (records.length === 0) { alert("No records"); return; }
  let msg = "Finished batches for " + code + ":\n\n";
  records.forEach(r => {
    const sheetFin = (r.status||"").toLowerCase() === "finished";
    const localFin = isLocallyFinished(r.code, r.qc);
    if (sheetFin || localFin) msg += `• QC ${r.qc||"—"} | Batch ${r.batch||"—"} | Exp ${r.exp||"—"}\n  [${sheetFin?"Sheet":"Local"}]\n\n`;
  });
  const restore = confirm(msg + "\nRestore ALL local-finished batches?");
  if (restore) {
    records.forEach(r => { if (isLocallyFinished(r.code, r.qc)) unmarkFinished(r.code, r.qc); });
    setStatus("Restored");
    if (state.currentProduct) showWeighingForProduct(state.currentProduct.code);
  }
}

function printBOM(productCode){
  const product = state.products.find(p => p.code === productCode);
  const bomItems = state.bom.filter(b => b.product === productCode);
  const co = getCompany();
  const today = new Date();
  const dateStr = today.toISOString().slice(0,10);
  const timeStr = today.toTimeString().slice(0,5);
  const rows = [];
  bomItems.forEach((b, idx) => {
    const all = state.rawMaterials.filter(r => r.code === b.material);
    const active = all.filter(r => {
      const s = (r.status||"").toLowerCase();
      return s !== "finished" && s !== "expired" && !isLocallyFinished(r.code, r.qc);
    });
    if (active.length === 0) rows.push({ n:idx+1, code:b.material, name:"(no active batch)", batch:"—", qc:"—", mfg:"—", exp:"—" });
    else active.forEach(r => rows.push({ n:idx+1, code:r.code, name:r.name, batch:r.batch||"—", qc:r.qc||"—", mfg:r.mfg||"—", exp:r.exp||"—" }));
  });
  const tableRows = rows.map(r => `<tr><td>${r.n}</td><td>${esc(r.code)}</td><td>${esc(r.name)}</td><td>${esc(r.batch)}</td><td>${esc(r.qc)}</td><td>${esc(r.mfg)}</td><td>${esc(r.exp)}</td></tr>`).join("");
  document.getElementById("print-area").innerHTML = `
    <div class="print-header">
      <img src="https://cdn.brandfetch.io/iduO5hv2yD/w/301/h/66/theme/light/logo.png?c=1bxid64Mup7aczewSAYMX&t=1781515577466" alt="Afrab Chem"/>
      <div><h1>${esc(co.name)}</h1>
      <div class="addr">${esc(co.address)}<br>${co.phone?"Phone: "+esc(co.phone):""}${co.email?" &nbsp;|&nbsp; Email: "+esc(co.email):""}</div></div>
    </div>
    <div class="print-title">Bill of Materials</div>
    <div class="print-meta">
      <div><b>Product:</b> ${esc(product.name)}</div>
      <div><b>Product Code:</b> ${esc(product.code)}</div>
      <div><b>Date Printed:</b> ${dateStr} ${timeStr}</div>
      <div><b>Total Materials:</b> ${rows.length}</div>
    </div>
    <table class="print-table">
      <thead><tr><th>#</th><th>Code</th><th>Material Name</th><th>Batch No</th><th>QC No</th><th>MFG Date</th><th>Expiry Date</th></tr></thead>
      <tbody>${tableRows}</tbody>
    </table>
    <div class="print-sign"><div>Prepared by</div><div>Checked by</div></div>`;
  setTimeout(() => window.print(), 100);
}

function openPicker(title, items, allowCustom){
  return new Promise(resolve => {
    const overlay = document.createElement("div");
    overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px";
    const panel = document.createElement("div");
    panel.style.cssText = "background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:16px;width:100%;max-width:520px;max-height:85vh;display:flex;flex-direction:column";
    panel.innerHTML = `
      <h3 style="color:var(--accent);margin:0 0 12px 0;font-size:16px">${esc(title)}</h3>
      <input class="search" id="pkSearch" placeholder="Search or type..."/>
      <div id="pkList" style="flex:1;overflow:auto;min-height:100px;max-height:50vh"></div>
      <button class="action-btn alt" id="pkCancel" style="margin-top:12px;width:100%">Cancel</button>`;
    overlay.appendChild(panel);
    document.body.appendChild(overlay);
    const search = panel.querySelector("#pkSearch");
    const list = panel.querySelector("#pkList");
    const render = (q) => {
      const raw = (q||"").trim();
      const query = raw.toLowerCase();
      const filtered = query ? items.filter(x => x.toLowerCase().includes(query)) : items;
      let html = filtered.length ? filtered.map(x => `<div class="product-item" data-v="${esc(x)}">${esc(x)}</div>`).join("") : `<div class="empty" style="padding:20px">No matches.</div>`;
      if (allowCustom && raw && !items.some(x => x.toLowerCase() === query)) html += `<div class="product-item" data-v="${esc(raw)}" style="border-color:var(--accent);color:var(--accent)">+ Use "${esc(raw)}"</div>`;
      list.innerHTML = html;
      list.querySelectorAll("[data-v]").forEach(el => { el.onclick = () => { cleanup(); resolve(el.getAttribute("data-v")); }; });
    };
    render("");
    search.addEventListener("input", e => render(e.target.value));
    panel.querySelector("#pkCancel").onclick = () => { cleanup(); resolve(null); };
    function cleanup(){ overlay.remove(); }
  });
}
function getPickerSource(source, machineNames, operatorNames){
  if (source === "machines") return machineNames;
  if (source === "operators") return operatorNames;
  if (source === "filling_lines") return FILLING_LINES;
  return [];
}

// ============================================================
// GENERIC TEMPLATE ENTRY
// ============================================================
async function renderTemplate(templateKey){
  const tpl = TEMPLATES[templateKey];
  const c = document.getElementById("module-content");
  c.innerHTML = `<div class="loading">Loading…</div>`;
  try {
    const [products, machines, operators] = await Promise.all([loadProducts(), loadMachines(), loadOperators()]);
    const machineNames = machines.map(m => m.name || m);
    const operatorNames = operators.map(o => o.name || o);

    const emptyRow = () => { const row = { product:"", productCode:"" }; tpl.fields.forEach(f => row[f.key] = ""); return row; };
    let entries = [emptyRow()];
    let date = new Date().toISOString().slice(0,10);

    const root = document.createElement("div");
    root.innerHTML = `
      <div class="entry-row"><label>Date</label><input type="date" id="tplDate" value="${date}"/></div>
      <div id="tplEntries"></div>
      <button class="action-btn" id="tplAdd" style="width:100%;margin-bottom:12px">+ Add Another Entry</button>
      <button class="action-btn green" id="tplSave" style="width:100%;margin-bottom:16px">💾 Save & Send</button>
      <div id="tplSync"></div>
      <div id="tplPending"></div>`;
    c.innerHTML = ""; c.appendChild(root);

    const entriesBox = root.querySelector("#tplEntries");
    const syncBox = root.querySelector("#tplSync");
    const pendingBox = root.querySelector("#tplPending");

    const renderSyncBanner = () => {
      const pending = getPending(tpl.storageKey);
      if (pending.length === 0) { syncBox.innerHTML = `<div class="ok-banner">✅ No pending entries. All sent.</div>`; return; }
      syncBox.innerHTML = `<div class="info-banner">${pending.length} pending entr${pending.length===1?"y":"ies"} waiting to sync.<div style="margin-top:10px"><button class="action-btn orange" id="tplSyncNow">🔄 Sync Now</button></div></div>`;
      const btn = syncBox.querySelector("#tplSyncNow");
      if (btn) btn.onclick = async () => { await syncTemplate(tpl); renderSyncBanner(); renderPending(); };
    };

    const renderEntries = () => {
      entriesBox.innerHTML = entries.map((e, i) => {
        const fieldHtml = tpl.fields.map(f => {
          if (f.type === "picker") {
            const picked = e[f.key];
            return `<div class="entry-row"><label>${esc(f.label)}</label>
              <button class="picker-btn" data-field="${i}::${f.key}">${picked ? esc(picked) : "Tap to choose"}</button></div>`;
          }
          return `<div class="entry-row"><label>${esc(f.label)}</label>
            <input data-field="${i}::${f.key}" type="${f.type === "number" ? "number" : "text"}" ${f.type === "number" ? 'inputmode="numeric"' : ''} value="${esc(e[f.key]||"")}" placeholder="${esc(f.placeholder||"")}"/></div>`;
        }).join("");
        return `<div class="entry-card"><h4>Entry ${i+1}${entries.length > 1 ? ` <button class="remove-btn" data-rm="${i}">Remove</button>` : ""}</h4>
          <div class="entry-row"><label>Product</label>
            <button class="picker-btn" data-prod="${i}">${e.product ? esc(e.product) : "Tap to choose product"}</button></div>
          ${fieldHtml}</div>`;
      }).join("");
      bindEntryHandlers();
    };

    const bindEntryHandlers = () => {
      entriesBox.querySelectorAll("[data-prod]").forEach(btn => {
        btn.onclick = async () => {
          const i = +btn.getAttribute("data-prod");
          const names = products.map(p => `${p.code} — ${p.name}`);
          const picked = await openPicker("Choose Product", names, false);
          if (picked) {
            const code = picked.split(" — ")[0];
            const found = products.find(p => p.code === code);
            if (found) { entries[i].product = found.name; entries[i].productCode = found.code; renderEntries(); }
          }
        };
      });
      entriesBox.querySelectorAll("[data-field]").forEach(el => {
        const tag = el.tagName.toLowerCase();
        const attr = el.getAttribute("data-field"); if (!attr) return;
        const [iStr, key] = attr.split("::"); const i = +iStr;
        const fieldDef = tpl.fields.find(f => f.key === key); if (!fieldDef) return;
        if (tag === "button") {
          const source = getPickerSource(fieldDef.source, machineNames, operatorNames);
          el.onclick = async () => {
            const picked = await openPicker("Choose " + fieldDef.label, source, !!fieldDef.allowCustom);
            if (picked) { entries[i][key] = picked; renderEntries(); }
          };
        } else if (tag === "input") {
          el.oninput = ev => { entries[i][key] = ev.target.value; };
        }
      });
      entriesBox.querySelectorAll("[data-rm]").forEach(btn => {
        btn.onclick = () => {
          const i = +btn.getAttribute("data-rm"); entries.splice(i, 1);
          if (entries.length === 0) entries.push(emptyRow()); renderEntries();
        };
      });
    };

    const renderPending = () => {
      const pending = getPending(tpl.storageKey);
      if (pending.length === 0) { pendingBox.innerHTML = ""; return; }
      pendingBox.innerHTML = `<div style="color:var(--dim);font-size:12px;margin-top:16px;margin-bottom:8px">Pending entries:</div>` +
        pending.map((p, i) => {
          const lines = [];
          Object.keys(p).forEach(k => { if (k === "Saved At") return; lines.push(`<div><b>${esc(k)}:</b> ${esc(p[k])}</div>`); });
          return `<div class="entry-card"><h4>#${i+1} <button class="remove-btn" data-del="${i}">Delete</button></h4><div style="font-size:13px;line-height:1.6">${lines.join("")}</div></div>`;
        }).join("");
      pendingBox.querySelectorAll("[data-del]").forEach(btn => {
        btn.onclick = () => {
          const i = +btn.getAttribute("data-del"); const list = getPending(tpl.storageKey);
          list.splice(i, 1); savePending(tpl.storageKey, list); renderPending(); renderSyncBanner();
        };
      });
    };

    root.querySelector("#tplAdd").onclick = () => { entries.push(emptyRow()); renderEntries(); };
    root.querySelector("#tplSave").onclick = async () => {
      const d = root.querySelector("#tplDate").value || date;
      const valid = entries.filter(e => {
        if (!e.product) return false;
        return tpl.fields.every(f => String(e[f.key]||"").trim() !== "");
      });
      if (valid.length === 0) { alert("Fill in at least one complete entry.\n\nEvery field is required."); return; }
      const toSave = valid.map(e => tpl.toRow(d, e));
      const existing = getPending(tpl.storageKey);
      savePending(tpl.storageKey, existing.concat(toSave));
      entries = [emptyRow()];
      renderEntries(); renderPending(); renderSyncBanner();
      setStatus("Sending…");
      const r = await syncTemplate(tpl);
      renderSyncBanner(); renderPending();
      if (r.sent > 0 && r.remaining === 0) alert(`✅ ${r.sent} entr${r.sent===1?"y":"ies"} sent.`);
      else if (r.remaining > 0) alert(`⚠️ ${r.remaining} kept on phone. Tap "Sync Now" to retry.`);
    };

    renderEntries(); renderPending(); renderSyncBanner();
    setStatus(tpl.title + " ready");
  } catch(err){
    c.innerHTML = `<div class="err-banner">Failed to load: ${esc(err.message)}</div>
      <button class="back-btn" onclick="goHome()">← Back</button>`;
  }
}
