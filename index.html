<style>

  .user-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);gap:8px}

    .print-header img { height: 60px; }

    .print-title { font-size: 18px; font-weight: bold; text-align: center; margin: 20px 0; text-transform: uppercase; color: #ff0000; }
    .print-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px; margin-bottom: 20px; }
    .print-meta b { display: inline-block; min-width: 100px; }
    .print-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 20px; }
    .print-table th, .print-table td { border: 1px solid #000; padding: 6px 8px; text-align: left; vertical-align: top; }
    .print-table th { background: #fff5f5; font-weight: bold; color: #ff0000; }
    .print-sign { display: flex; justify-content: space-between; margin-top: 40px; font-size: 13px; }
    .print-sign div { border-top: 1px solid #000; width: 40%; padding-top: 4px; }
  }
  .print-only { display: none; }
</style>

<script>
// ============================================================
// CONFIG
// ============================================================
const SPREADSHEET_ID = "1mwo5IXXrIu4bnqR8GOV1qNxQ31rdfdUjeLfBQf22t1M";
const API_BASE = "https://script.google.com/macros/s/AKfycbxfMogJHZwYY7lofdZDsMyNXz0_B1XnFTgCZFGj232-9_mSo_P_juAM2WSo5dg9OL66Ng/exec";
const AUTH_KEY = "afrab.auth.v1";

const SHEETS = { products:"Drug database", raw_materials:"raw_materials", bom:"bom", machines:"machines", operators:"operators" };
const RECEIPT_SHEET = "receipt_log", RECEIPT_STORAGE = "afrab.receipt.pending";
const WEIGHING_SHEET = "weighing_log", WEIGHING_STORAGE = "afrab.weighing.pending";

const FILLING_LINES = ["100ml line (FL 2)","15ml drops line (FL1)","Ibuprofen Line (FL3)","Manual Line","External","Antibiotics"];

const ROLE_LABELS = {
  packing:"Packing Supervisor", filling:"Filling Supervisor", receipt:"Product Receiver",
  shrink:"Label / Shrinkwrap", coding:"Coding Supervisor",
  weighing:"Weighing Staff", admin:"Admin"
};

// ============================================================
// AUTH
// ============================================================
function getAuth(){ try { return JSON.parse(localStorage.getItem(AUTH_KEY)) || null; } catch(e) { return null; } }
function setAuth(a){ localStorage.setItem(AUTH_KEY, JSON.stringify(a)); }
function clearAuth(){ localStorage.removeItem(AUTH_KEY); }
function getToken(){ const a = getAuth(); return a ? a.token : ""; }

// ============================================================
// SHA-256
// ============================================================
function sha256Hex(str){
  function rrot(n, x){ return (x >>> n) | (x << (32 - n)); }
  var K = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ];
  var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var bytes = [];
  for (var i = 0; i < str.length; i++){
    var c = str.charCodeAt(i);
    if (c < 128) bytes.push(c);
    else if (c < 2048){ bytes.push(192 | (c >> 6), 128 | (c & 63)); }
    else { bytes.push(224 | (c >> 12), 128 | ((c >> 6) & 63), 128 | (c & 63)); }
  }
  var bitLen = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  for (var i = 7; i >= 0; i--) bytes.push((bitLen / Math.pow(2, i*8)) & 0xff);
  for (var i = 0; i < bytes.length; i += 64){
    var w = new Array(64);
    for (var j = 0; j < 16; j++) w[j] = (bytes[i+j*4] << 24) | (bytes[i+j*4+1] << 16) | (bytes[i+j*4+2] << 8) | bytes[i+j*4+3];
    for (var j = 16; j < 64; j++){
      var s0 = rrot(7, w[j-15]) ^ rrot(18, w[j-15]) ^ (w[j-15] >>> 3);
      var s1 = rrot(17, w[j-2]) ^ rrot(19, w[j-2]) ^ (w[j-2] >>> 10);
      w[j] = (w[j-16] + s0 + w[j-7] + s1) | 0;
    }
    var a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
    for (var j = 0; j < 64; j++){
      var S1 = rrot(6, e) ^ rrot(11, e) ^ rrot(25, e);
      var ch = (e & f) ^ (~e & g);
      var t1 = (h + S1 + ch + K[j] + w[j]) | 0;
      var S0 = rrot(2, a) ^ rrot(13, a) ^ rrot(22, a);
      var mj = (a & b) ^ (a & c) ^ (b & c);
      var t2 = (S0 + mj) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0;
      d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
    H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
  }
  return H.map(function(x){
    var v = (x < 0 ? x + 0x100000000 : x).toString(16);
    while (v.length < 8) v = "0" + v;
    return v;
  }).join("");
}

// ============================================================
// API CALL (JSONP)
// ============================================================
function apiCall(action, params){
  return new Promise((resolve, reject) => {
    const cb = "afrab_api_" + Math.random().toString(36).slice(2);
    let done = false, script = null;
    const cleanup = () => {
      if (done) return; done = true;
      try { delete window[cb]; } catch(e){}
      if (script && script.parentNode) script.parentNode.removeChild(script);
    };
    const timer = setTimeout(() => { cleanup(); reject(new Error("Timeout")); }, 30000);
    window[cb] = (data) => { clearTimeout(timer); cleanup(); resolve(data); };
    let url = API_BASE + "?action=" + encodeURIComponent(action) + "&callback=" + cb;
    Object.keys(params || {}).forEach(k => { url += "&" + k + "=" + encodeURIComponent(params[k]); });
    script = document.createElement("script");
    script.src = url;
    script.onerror = () => { clearTimeout(timer); cleanup(); reject(new Error("Network error")); };
    document.head.appendChild(script);
  });
}

// ============================================================
// LOCAL CACHE
// ============================================================
const CACHE_TTL_MS = 12 * 60 * 60 * 1000;
function cacheGet(key){
  try {
    const raw = localStorage.getItem("afrab.cache." + key);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (!obj || !obj.t) return null;
    if (Date.now() - obj.t > CACHE_TTL_MS) return null;
    return obj.v;
  } catch(e) { return null; }
}
function cacheSet(key, value){
  try { localStorage.setItem("afrab.cache." + key, JSON.stringify({ t: Date.now(), v: value })); } catch(e) {}
}
function cacheClear(key){
  try {
    if (key) localStorage.removeItem("afrab.cache." + key);
    else Object.keys(localStorage).forEach(k => { if (k.indexOf("afrab.cache.") === 0) localStorage.removeItem(k); });
  } catch(e) {}
}

// ============================================================
// TEMPLATES
// ============================================================
const TEMPLATES = {

function makeReference(){
  const d = new Date();
  return "REC-" + d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + "-" + String(d.getHours()).padStart(2,'0') + String(d.getMinutes()).padStart(2,'0');
}
function currentMonthString(){ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,'0'); }
function todayString(){ return new Date().toISOString().slice(0,10); }
function parseYMD(s){
  if (!s) return null;
  let m = String(s).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = String(s).match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if (m) return new Date(+m[3], +m[2]-1, +m[1]);
  const d = new Date(s); return isNaN(d) ? null : d;
}
function downtimeToHours(s){
  if (!s) return 0;
  const parts = String(s).split(":").map(x => parseInt(x,10)||0);
  while (parts.length < 3) parts.push(0);
  return parts[0] + parts[1]/60 + parts[2]/3600;
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// ============================================================
// FLEXIBLE DATE PARSER (FIXED)
// ============================================================
function parseFlexibleDate(str, isExpiry){
  if (!str) return null;
  str = String(str).trim(); if (!str) return null;

  // YYYY-MM-DD or YYYY-MM
  let m = str.match(/^(\d{4})[-\/](\d{1,2})(?:[-\/](\d{1,2}))?$/);
  if (m){
    const y = +m[1], mo = +m[2] - 1;
    const d = m[3] ? +m[3] : (isExpiry ? new Date(y, mo+1, 0).getDate() : 1);
    return new Date(y, mo, d);
  }

  // DD/MM/YYYY or MM/DD/YYYY or DD.MM.YYYY
  m = str.match(/^(\d{1,2})[-\/\.](\d{1,2})[-\/\.](\d{4})$/);
  if (m) return new Date(+m[3], +m[2]-1, +m[1]);

  // MM/YYYY or MM/YY — THE FIX for 05/28, 02/25, 11/27
  m = str.match(/^(\d{1,2})[-\/](\d{2,4})$/);
  if (m){
    const mo = +m[1] - 1;
    let y = +m[2];
    if (y < 100) y += (y < 70 ? 2000 : 1900);
    const d = isExpiry ? new Date(y, mo+1, 0).getDate() : 1;
    return new Date(y, mo, d);
  }

  // Month name + year: June 2029, Jan-2028, Jun/27
  const months = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  m = str.match(/^([A-Za-z]{3,})[\s\-\/](\d{2,4})$/);
  if (m){
    const mo = months[m[1].slice(0,3).toLowerCase()];
    if (mo !== undefined){
      let y = +m[2];
      if (y < 100) y += (y < 70 ? 2000 : 1900);
      const d = isExpiry ? new Date(y, mo+1, 0).getDate() : 1;
      return new Date(y, mo, d);
    }
  }

  // Fallback
  const n = new Date(str);
  return isNaN(n) ? null : n;
}

const fetchLog = {};
function fetchSheet(sheetName){
  return new Promise((resolve, reject) => {
    const cb = "gviz_cb_" + Math.random().toString(36).slice(2);
    let done = false, script = null;
    const cleanup = () => { if (done) return; done = true; try { delete window[cb]; } catch(e){} if (script && script.parentNode) script.parentNode.removeChild(script); };
    const timer = setTimeout(() => { cleanup(); fetchLog[sheetName] = "TIMEOUT"; reject(new Error("Timeout")); }, 20000);
    window[cb] = function(data){
      clearTimeout(timer);
      try {
        if (!data || data.status !== "ok" || !data.table) { fetchLog[sheetName] = "Bad response"; cleanup(); reject(new Error("Invalid response")); return; }
        const rawRows = (data.table.rows || []).map(row => (row.c || []).map(cell => {
          if (!cell) return "";
          if (cell.f !== undefined && cell.f !== null) return String(cell.f);
          if (cell.v !== undefined && cell.v !== null) return String(cell.v);
          return "";
        }));
        const cols = (data.table.cols || []).map(c => String(c.label || "").trim());
        const haveLabels = cols.length > 0 && cols.some(l => l && /[a-z]/i.test(l));
        let headers, dataRows;
        if (haveLabels) { headers = cols; dataRows = rawRows; }
        else { const copy = rawRows.slice(); headers = (copy.shift() || []).map(h => String(h).trim()); dataRows = copy; }
        const rows = dataRows.map(r => { const obj = {}; headers.forEach((h, i) => { if (h) obj[h] = r[i] || ""; }); return obj; });
        fetchLog[sheetName] = "OK rows=" + rows.length;
        cleanup(); resolve(rows);
      } catch(err){ cleanup(); fetchLog[sheetName] = "Parse error"; reject(err); }
    };
    const url = "https://docs.google.com/spreadsheets/d/" + SPREADSHEET_ID + "/gviz/tq?sheet=" + encodeURIComponent(sheetName) + "&tqx=out:json;responseHandler:" + cb;
    script = document.createElement("script");
    script.src = url;
    script.onerror = () => { clearTimeout(timer); fetchLog[sheetName] = "Script load failed"; cleanup(); reject(new Error("Script load failed")); };
    document.head.appendChild(script);
  });
}
async function safeFetch(sheetName){ try { return await fetchSheet(sheetName); } catch(e){ return []; } }

async function syncPending(sheetName, storageKey){
  const pending = getPending(storageKey);
  if (!pending.length) return { sent:0, remaining:0 };
  setStatus(`Sending ${pending.length}…`);
  const ok = await postRows(sheetName, pending);
  if (ok) { savePending(storageKey, []); setStatus(`Sent ${pending.length}`); return { sent: pending.length, remaining: 0 }; }
  setStatus(`Send failed (${pending.length} kept)`);
  return { sent: 0, remaining: pending.length };
}
async function syncTemplate(tpl){ return syncPending(tpl.sheetName, tpl.storageKey); }
async function autoSyncAll(){
  if (!navigator.onLine) return;
  if (!getAuth()) return;
  for (const key of Object.keys(TEMPLATES)) await syncTemplate(TEMPLATES[key]);
  await syncPending(RECEIPT_SHEET, RECEIPT_STORAGE);
}
function scheduleAutoSync(){ setTimeout(autoSyncAll, 5000); setInterval(autoSyncAll, 120000); }

function findKey(obj, ...keywords){
  if (!obj) return null;
  const keys = Object.keys(obj);
  for (const k of keywords){
    const found = keys.find(kk => kk.toLowerCase().includes(k.toLowerCase()));
    if (found) return found;
  }
  return null;
}

async function loadProducts(forceRefresh){
  if (!forceRefresh && state.products.length) return state.products;
  if (!forceRefresh) {
    const cached = cacheGet("products");
    if (cached && Array.isArray(cached) && cached.length) { state.products = cached; return cached; }
  }
  const rows = await fetchSheet(SHEETS.products);
  if (!Array.isArray(rows) || !rows.length) return [];
  const sample = rows[0];
  const kCode = findKey(sample, "product code", "code");
  const kName = findKey(sample, "product name", "name");
  const kActive = findKey(sample, "active");
  state.products = rows
    .filter(x => x[kCode] && String(x[kCode]).trim())
    .filter(x => !kActive || String(x[kActive]||"").trim().toUpperCase() !== "NO")
    .map(x => ({ code:String(x[kCode]).trim(), name:String(x[kName]||"").trim() }));
  cacheSet("products", state.products);
  return state.products;
}

async function loadRawMaterials(forceRefresh){
  if (!forceRefresh && state.rawMaterials.length) return state.rawMaterials;
  if (!forceRefresh) {

    if (cached && Array.isArray(cached)) { state.rawMaterials = cached; return cached; }
  }
  try {

    if (!Array.isArray(rows) || !rows.length) return [];
    const sample = rows[0];
    const kCode = findKey(sample, "material code");

    const kBatch = findKey(sample, "batch no","batch","lot");
    const kQC = findKey(sample, "qc");
    const kMFG = findKey(sample, "mfg","manufactur");
    const kEXP = findKey(sample, "expir","exp");
    const kStat = findKey(sample, "status");
    state.rawMaterials = rows
      .filter(x => x[kCode] && String(x[kCode]).trim())
      .map(x => ({ code:String(x[kCode]||"").trim(), name:String(x[kName]||"").trim(), batch:kBatch?String(x[kBatch]||"").trim():"", qc:String(x[kQC]||"").trim(), mfg:String(x[kMFG]||"").trim(), exp:String(x[kEXP]||"").trim(), status:kStat?String(x[kStat]||"").trim():"Active" }));

async function loadMachines(forceRefresh, category){

      const kCat = keys.find(k => k.toLowerCase() === "category");
      if (kName) {
        state.machines = rows
          .filter(x => x[kName] && String(x[kName]).trim())
          .filter(x => !kActive || String(x[kActive]||"").trim().toUpperCase() !== "NO")
          .filter(x => !/^FP\d+/i.test(String(x[kName]).trim()))
          .map(x => ({ name: String(x[kName]||"").trim(), category: kCat ? String(x[kCat]||"").trim().toLowerCase() : "" }));
      }
    }
  } catch(e){}
  if (state.machines.length === 0) state.machines = DEFAULTS;
  cacheSet("machines", state.machines);
  return filterByCategory(state.machines, category);
}

async function loadOperators(forceRefresh, category){
  if (!forceRefresh && state.operators.length) return filterByCategory(state.operators, category);
  if (!forceRefresh) {
    const cached = cacheGet("operators");
    if (cached && Array.isArray(cached)) { state.operators = cached; return filterByCategory(cached, category); }
  }
  try {
    const rows = await fetchSheet(SHEETS.operators);
    if (Array.isArray(rows) && rows.length) {
      const sample = rows[0];
      const keys = Object.keys(sample);
      const kName = keys.find(k => k.toLowerCase() === "operator name");
      const kActive = keys.find(k => k.toLowerCase() === "active");
      const kCat = keys.find(k => k.toLowerCase() === "category");
      if (kName) {
        state.operators = rows
          .filter(x => x[kName] && String(x[kName]).trim())
          .filter(x => !kActive || String(x[kActive]||"").trim().toUpperCase() !== "NO")
          .filter(x => !/^FP\d+/i.test(String(x[kName]).trim()))
          .map(x => ({ name: String(x[kName]||"").trim(), category: kCat ? String(x[kCat]||"").trim().toLowerCase() : "" }));
      }
    }
  } catch(e){}
  cacheSet("operators", state.operators);
  return filterByCategory(state.operators, category);
}

function filterByCategory(list, category){
  if (!category) return list;
  const cat = String(category).toLowerCase();
  return list.filter(x => {
    const c = String(x.category||"").toLowerCase();
    return !c || c === "both" || c === cat;
  });
}

async function addNewUser(){
  const username = document.getElementById("nu-user").value.trim().toLowerCase();
  const name = document.getElementById("nu-name").value.trim();
  const passcode = document.getElementById("nu-pass").value;
  const role = document.getElementById("nu-role").value;
  if (!username || !name || !passcode || role == null) { alert("All fields required"); return; }
  if (passcode.length < 6) { alert("Passcode must be at least 6 characters"); return; }
  const hash = sha256Hex(passcode);
  try {
    const resp = await apiCall("addUser", { token: getToken(), newUsername: username, newName: name, newPasshash: hash, newRole: role });
    if (!resp || resp.error) { alert((resp && resp.error) || "Failed"); return; }
    renderUsers(`<div class="ok-banner">✅ User added</div>`);
  } catch(err) { alert(err.message); }

    if (!resp || resp.error) { alert((resp && resp.error) || "Failed"); return; }
    alert("✅ Passcode reset");

}

    <select class="field" id="rm-status">
      <option value="active"${String(rec["Status"]||"").toLowerCase()==="active"?" selected":""}>Active</option>
      <option value="finished"${String(rec["Status"]||"").toLowerCase()==="finished"?" selected":""}>Finished</option>
    </select>
    <div style="margin-top:16px">
      <button class="action-btn green" id="rm-save">Save</button>
      <button class="action-btn alt" id="rm-cancel">Cancel</button>
    </div>`;
  overlay.appendChild(panel);
  document.body.appendChild(overlay);

  panel.querySelector("#rm-cancel").onclick = () => overlay.remove();
  panel.querySelector("#rm-save").onclick = async () => {
    const batchNo = panel.querySelector("#rm-batch").value.trim();
    const qcNo = panel.querySelector("#rm-qc").value.trim();
    const mfg = panel.querySelector("#rm-mfg").value.trim();
    const exp = panel.querySelector("#rm-exp").value.trim();
    const status = panel.querySelector("#rm-status").value;
    try {
      const resp = await apiCall("updateRawMaterial", {
        token: getToken(),
        row: rowNum,
        batchNo: batchNo,
        qcNo: qcNo,
        mfg: mfg,
        exp: exp,
        status: status
      });
      if (!resp || resp.error) { alert((resp && resp.error) || "Failed"); return; }
      overlay.remove();
      cacheClear("raw_materials");
      state.rawMaterials = [];
      renderRawMaterialsEditor();
    } catch(err) { alert(err.message); }
  };
}

async function openBOMForProduct(productCode) {
  document.getElementById("module-title").textContent = "BOM Editor";
  const c = document.getElementById("module-content");
  const product = state.products.find(p => p.code === productCode);
  showScreen("screen-module");
  c.innerHTML = `<div class="loading">Loading BOM…</div>`;

  try {
    const [bomResp, codesResp] = await Promise.all([
      apiCall("listBOM", { token: getToken(), productCode: productCode }),
      apiCall("listMaterialCodes", { token: getToken() })
    ]);
    if (!bomResp || bomResp.error) { c.innerHTML = `<div class="err-banner">${esc((bomResp && bomResp.error)||"Failed")}</div>`; return; }
    const materials = bomResp.materials || [];
    const availableCodes = (codesResp && codesResp.codes) || [];

    c.innerHTML = `
      <button class="back-btn" onclick="renderBOMManager()">← Products</button>
      <div style="background:var(--panel);border-radius:12px;padding:14px;margin-bottom:12px">
        <div style="font-family:monospace;color:var(--dim);font-size:12px">${esc(product.code)}</div>
        <div style="font-size:17px;font-weight:600;margin-top:4px">${esc(product.name)}</div>
      </div>
      <div class="info-banner">${materials.length} material(s) in this product's BOM</div>
      <div id="bom-materials"></div>
      <button class="action-btn green" id="bom-add" style="width:100%;margin-top:16px">+ Add Material</button>
      <div id="bom-msg"></div>`;

    const renderMaterials = () => {
      const box = document.getElementById("bom-materials");
      if (!materials.length) { box.innerHTML = `<div class="empty">No materials yet.</div>`; return; }
      box.innerHTML = materials.map(code => {
        const rec = state.rawMaterials.find(r => r.code === code);
        const name = rec ? rec.name : "";
        return `
          <div class="product-item" style="display:flex;justify-content:space-between;align-items:center">
            <div>
              <div class="code">${esc(code)}</div>
              <div class="name">${esc(name)}</div>
            </div>
            <button class="remove-btn" onclick="removeBOM('${esc(productCode)}','${esc(code)}')">Remove</button>
          </div>`;
      }).join("");
    };
    renderMaterials();

    document.getElementById("bom-add").onclick = async () => {
      const items = availableCodes
        .filter(c => materials.indexOf(c.code) === -1)
        .map(c => `${c.code} — ${c.name}`);
      if (!items.length) { alert("No more materials available to add."); return; }
      const picked = await openPicker("Add Material to BOM", items, false);
      if (!picked) return;
      const code = picked.split(" — ")[0];
      const msg = document.getElementById("bom-msg");
      msg.innerHTML = `<div class="info-banner">Adding…</div>`;
      try {
        const resp = await apiCall("addBOMEntry", { token: getToken(), productCode: productCode, materialCode: code });
        if (!resp || resp.error) { msg.innerHTML = `<div class="err-banner">${esc((resp && resp.error)||"Failed")}</div>`; return; }
        materials.push(code);
        cacheClear("bom"); state.bom = [];
        renderMaterials();
        msg.innerHTML = `<div class="ok-banner">✅ Material added</div>`;
      } catch(err) { msg.innerHTML = `<div class="err-banner">${esc(err.message)}</div>`; }
    };
  } catch(err) {
    c.innerHTML = `<div class="err-banner">${esc(err.message)}</div>
      <button class="back-btn" onclick="renderBOMManager()">← Back</button>`;
  }
}

async function removeBOM(productCode, materialCode) {
  if (!confirm(`Remove ${materialCode} from this BOM?`)) return;
  try {
    const resp = await apiCall("removeBOMEntry", { token: getToken(), productCode: productCode, materialCode: materialCode });
    if (!resp || resp.error) { alert((resp && resp.error) || "Failed"); return; }
    cacheClear("bom"); state.bom = [];
    openBOMForProduct(productCode);
  } catch(err) { alert(err.message); }
}

async function showWeighingForProduct(productCode){
  const c = document.getElementById("module-content");
  const product = state.products.find(p => p.code === productCode);
  state.currentProduct = product;
  const bomItems = state.bom.filter(b => b.product === productCode);
  const today = new Date();

  let sessionBatch = "";
  let sessionBatchSize = "";
  let sessionStaff = localStorage.getItem("afrab.lastweigher") || "";
  const ticked = {};

  const renderPage = () => {
    try {
      const materials = bomItems.map(b => {
        const all = state.rawMaterials.filter(r => r.code === b.material);
        const enriched = all.map(r => ({ ...r, sheetFinished:(r.status||"").trim().toLowerCase() === "finished" }));
        const active = enriched.filter(r => !r.sheetFinished);
        const finishedList = enriched.filter(r => r.sheetFinished);
        return { materialCode: b.material, active, finishedList, total: all.length };
      });

      function daysUntil(s){ const d = parseFlexibleDate(s, true); if (!d) return null; return Math.floor((d - today)/86400000); }
      function statusFor(days){
        if (days === null) return { cls:"", label:"—", pill:"ok" };
        if (days < 0) return { cls:"expired", label:`EXPIRED ${Math.abs(days)}d ago`, pill:"expired" };
        if (days < 30) return { cls:"danger", label:`URGENT ${days}d`, pill:"danger" };
        if (days < 90) return { cls:"warn", label:`${days}d left`, pill:"warn" };
        return { cls:"", label:`${days}d left`, pill:"ok" };
      }

      let html = `
        <button class="back-btn" onclick="renderWeighingProductPicker()">← Products</button>
        <div style="background:var(--panel);border-radius:12px;padding:14px;margin-bottom:12px">
          <div style="font-family:monospace;color:var(--dim);font-size:12px">${esc(product.code)}</div>
          <div style="font-size:17px;font-weight:600;margin-top:4px">${esc(product.name)}</div>
        </div>
        <div class="session-banner">
          <div style="margin-bottom:10px"><b>📋 Weighing Session</b></div>
          <div class="entry-row"><label>Batch No being produced</label>
            <input id="wBatch" value="${esc(sessionBatch)}" placeholder="e.g. 26001" style="font-family:monospace;font-weight:700"/></div>
          <div class="entry-row"><label>Batch Size (in bottles)</label>
            <input id="wBatchSize" type="number" inputmode="numeric" value="${esc(sessionBatchSize)}" placeholder="e.g. 5000"/></div>
          <div class="entry-row" style="margin-bottom:0"><label>Weighed by (your name)</label>
            <input id="wStaff" value="${esc(sessionStaff)}" placeholder="Your name"/></div>
        </div>
        <button class="action-btn green" id="wPrintBOM" style="margin-bottom:14px">🖨️ Print BOM</button>`;

      if (materials.length === 0){
        html += `<div class="info-banner"><b>No BOM on file — you can still log this batch.</b><br>Enter batch no, batch size, and your name above, then tap Confirm.</div>`;
        html += `<div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border)">
          <button class="action-btn green" id="wConfirm" style="width:100%">✅ Confirm Weighing Session</button>
        </div>`;
        c.innerHTML = html;
        c.querySelector("#wPrintBOM").onclick = () => printBOM(productCode);
        c.querySelector("#wBatch").addEventListener("input", e => sessionBatch = e.target.value);
        c.querySelector("#wBatchSize").addEventListener("input", e => sessionBatchSize = e.target.value);
        c.querySelector("#wStaff").addEventListener("input", e => sessionStaff = e.target.value);
        c.querySelector("#wConfirm").onclick = () => confirmWeigh({ product, sessionBatch, sessionBatchSize, sessionStaff, tickedMaterials: [] });
        return;
      }

      let tickedCount = 0;
      materials.forEach(m => { m.active.forEach(r => { const key = m.materialCode + "|" + r.qc + "|" + r.batch; if (ticked[key]) tickedCount++; }); });

      html += `<div style="font-size:12px;color:var(--dim);margin-bottom:8px">Materials needed — tap the circle ✓ after you weigh each one. ${tickedCount > 0 ? `<b style="color:var(--green)">${tickedCount} ticked</b>` : ""}</div>`;

      materials.forEach((m, idx) => {
        const totalActive = m.active.length;
        html += `<div style="margin-bottom:14px">
          <div style="color:var(--dim);font-size:11px;font-family:monospace;margin-bottom:4px">
            MATERIAL ${idx+1} of ${materials.length}${totalActive > 1 ? ` — ${totalActive} active batches` : ""}
          </div>`;
        if (m.active.length === 0 && m.finishedList.length === 0) {
          html += `<div class="material-card expired"><div class="mat-code">${esc(m.materialCode)}</div>
            <div class="mat-name">Not in Raw Materials sheet</div></div>`;
        } else if (m.active.length === 0) {
          html += `<div class="material-card done"><div class="mat-code">${esc(m.materialCode)}</div>
            <div class="mat-name">✓ All batches finished (${m.finishedList.length})</div></div>`;
        } else {
          m.active.forEach((rec, idx2) => {
            const days = daysUntil(rec.exp);
            const st = statusFor(days);
            const safeCode = esc(rec.code), safeQc = esc(rec.qc||""), safeBatch = esc(rec.batch||"");
            const key = m.materialCode + "|" + (rec.qc||"") + "|" + (rec.batch||"");
            const isTicked = !!ticked[key];
            const batchLabel = totalActive > 1 ? `<div style="font-size:10px;color:var(--accent2);margin-bottom:6px">Batch ${idx2+1} of ${totalActive}</div>` : "";
            html += `<div class="material-card ${st.cls} ${isTicked?'ticked':''}">
              ${batchLabel}
              <div class="mat-row">
                <span class="mat-code">${safeCode}</span>
                <div style="display:flex;align-items:center;gap:8px">
                  <span class="alert-pill ${st.pill}">${st.label}</span>
                  <button class="tick-btn ${isTicked?'on':''}" data-tick="${esc(key)}">${isTicked?'✓':''}</button>
                </div>
              </div>
              <div class="mat-name">${esc(rec.name)}</div>
              <div class="mat-detail">
                <span class="mat-label">Batch No:</span><span class="mat-value">${safeBatch||"—"}</span>
                <span class="mat-label">QC No:</span><span class="mat-value">${safeQc||"—"}</span>
                <span class="mat-label">MFG Date:</span><span class="mat-value">${esc(rec.mfg||"—")}</span>
                <span class="mat-label">Expiry:</span><span class="mat-value">${esc(rec.exp||"—")}</span>
              </div>
              <button class="edit-btn" onclick="editWeighingMaterial('${safeCode}','${safeBatch}','${safeQc}')">✏️ Edit</button>
            </div>`;
          });
        }
        html += `</div>`;
      });

      html += `<div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border)">
          <button class="action-btn green" id="wConfirm" style="width:100%">✅ Confirm Weighing Session</button>
        </div>`;

      c.innerHTML = html;

      c.querySelector("#wBatch").addEventListener("input", e => sessionBatch = e.target.value);
      c.querySelector("#wBatchSize").addEventListener("input", e => sessionBatchSize = e.target.value);
      c.querySelector("#wStaff").addEventListener("input", e => sessionStaff = e.target.value);
      c.querySelector("#wPrintBOM").onclick = () => printBOM(productCode);
      c.querySelectorAll("[data-tick]").forEach(btn => {
        btn.onclick = () => {
          const key = btn.getAttribute("data-tick");
          if (ticked[key]) delete ticked[key]; else ticked[key] = true;
          renderPage();
        };
      });

      c.querySelector("#wConfirm").onclick = async () => {
        const tickedMaterials = [];
        materials.forEach(m => {
          m.active.forEach(r => {
            const key = m.materialCode + "|" + (r.qc||"") + "|" + (r.batch||"");
            if (ticked[key]) tickedMaterials.push({ code:r.code, qc:r.qc||"", batch:r.batch||"" });
          });
        });
        confirmWeigh({ product, sessionBatch, sessionBatchSize, sessionStaff, tickedMaterials });
      };
    } catch(err) {
      c.innerHTML = `<div class="err-banner">Render error: ${esc(err.message)}\n\n${esc((err.stack||"").slice(0,400))}</div>
        <button class="back-btn" onclick="renderWeighingProductPicker()">← Products</button>`;
    }
  };

  renderPage();
}

function editWeighingMaterial(code, batch, qc) {
  apiCall("listRawMaterialsAdmin", { token: getToken() }).then(resp => {
    if (!resp || resp.error) { alert((resp && resp.error) || "Failed"); return; }
    const hit = (resp.rows || []).find(r =>
      String(r["Material Code"]||"") === code &&
      String(r["Batch No"]||"") === String(batch||"") &&
      String(r["QC No"]||"") === String(qc||"")
    );
    if (!hit) { alert("Material row not found"); return; }
    openRawMaterialEditorOnWeighing(hit._row, hit);
  }).catch(err => alert(err.message));
}

      });
      if (!resp || resp.error) { alert((resp && resp.error) || "Failed"); return; }
      overlay.remove();

      state.rawMaterials = [];
      if (state.currentProduct) showWeighingForProduct(state.currentProduct.code);
    } catch(err) { alert(err.message); }

async function confirmWeigh({ product, sessionBatch, sessionBatchSize, sessionStaff, tickedMaterials }) {
  const bn = String(sessionBatch || "").trim();
  const bs = String(sessionBatchSize || "").trim();
  const who = String(sessionStaff || "").trim();
  if (!bn) { alert("Please enter the batch number."); return; }
  if (!bs) { alert("Please enter the batch size."); return; }
  if (!who) { alert("Please enter your name (Weighed by)."); return; }

  localStorage.setItem("afrab.lastweigher", who);

  const enriched = (tickedMaterials || []).map(m => {
    const rec = state.rawMaterials.find(r =>
      r.code === m.code &&
      String(r.qc||"") === String(m.qc||"") &&
      String(r.batch||"") === String(m.batch||"")
    );
    return {
      code: m.code,
      name: rec ? rec.name : "",
      batch: m.batch || "",
      qc: m.qc || "",
      mfg: rec ? rec.mfg : "",
      exp: rec ? rec.exp : ""
    };
  });

  setStatus("Sending…");
  try {
    const resp = await apiCall("weighConfirm", {
      token: getToken(),
      date: todayString(),
      productCode: product.code,
      productName: product.name,
      batchNo: bn,
      batchSize: bs,
      weighedBy: who,
      materials: JSON.stringify(enriched)
    });
    if (!resp || resp.error) {
      alert("⚠️ " + ((resp && resp.error) || "Failed"));
      setStatus("Send failed");
      return;
    }
    alert(`✅ Weighing logged.\n\nBatch ${bn}\nBatch Size ${bs}\n${enriched.length} material(s)\nWeighed by ${who}`);
    cacheClear("raw_materials");
    state.rawMaterials = [];
    renderWeighingProductPicker();
  } catch(err) {
    alert("⚠️ " + err.message);
    setStatus("Send failed");
  }
}

function printBOM(productCode){
  const product = state.products.find(p => p.code === productCode);
  const bomItems = state.bom.filter(b => b.product === productCode);
  const co = getCompany();
  const today = new Date();
  const dateStr = today.toISOString().slice(0,10);
  const timeStr = today.toTimeString().slice(0,5);
  const rows = [];
  bomItems.forEach((b, idx) => {
    const all = state.rawMaterials.filter(r => r.code === b.material);
    const active = all.filter(r => {
      const s = (r.status||"").toLowerCase();
      return s !== "finished" && s !== "expired";
    });
    if (active.length === 0) rows.push({ n:idx+1, code:b.material, name:"(no active batch)", batch:"—", qc:"—", mfg:"—", exp:"—" });
    else active.forEach(r => rows.push({ n:idx+1, code:r.code, name:r.name, batch:r.batch||"—", qc:r.qc||"—", mfg:r.mfg||"—", exp:r.exp||"—" }));
  });
  const tableRows = rows.map(r => `<tr><td>${r.n}</td><td>${esc(r.code)}</td><td>${esc(r.name)}</td><td>${esc(r.batch)}</td><td>${esc(r.qc)}</td><td>${esc(r.mfg)}</td><td>${esc(r.exp)}</td></tr>`).join("");
  document.getElementById("print-area").innerHTML = `
    <div class="print-header">
      <img src="https://cdn.brandfetch.io/iduO5hv2yD/w/301/h/66/theme/light/logo.png?c=1bxid64Mup7aczewSAYMX&t=1781515577466" alt="Afrab Chem"/>
      <div><h1>${esc(co.name)}</h1>
      <div class="addr">${esc(co.address)}<br>${co.phone?"Phone: "+esc(co.phone):""}${co.email?" &nbsp;|&nbsp; Email: "+esc(co.email):""}</div></div>
    </div>
    <div class="print-title">Bill of Materials</div>
    <div class="print-meta">
      <div><b>Product:</b> ${esc(product.name)}</div>
      <div><b>Product Code:</b> ${esc(product.code)}</div>
      <div><b>Date Printed:</b> ${dateStr} ${timeStr}</div>
      <div><b>Total Materials:</b> ${rows.length}</div>
    </div>
    <table class="print-table">
      <thead><tr><th>#</th><th>Code</th><th>Material Name</th><th>Batch No</th><th>QC No</th><th>MFG Date</th><th>Expiry Date</th></tr></thead>
      <tbody>${tableRows}</tbody>
    </table>
    <div class="print-sign"><div>Prepared by</div><div>Checked by</div></div>`;
  setTimeout(() => window.print(), 100);
}

function openPicker(title, items, allowCustom){
  return new Promise(resolve => {
    const overlay = document.createElement("div");
    overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px";
    const panel = document.createElement("div");
    panel.style.cssText = "background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:16px;width:100%;max-width:520px;max-height:85vh;display:flex;flex-direction:column";
    panel.innerHTML = `
      <h3 style="color:var(--accent);margin:0 0 12px 0;font-size:16px">${esc(title)}</h3>
      <input class="search" id="pkSearch" placeholder="Search or type..."/>
      <div id="pkList" style="flex:1;overflow:auto;min-height:100px;max-height:50vh"></div>
      <button class="action-btn alt" id="pkCancel" style="margin-top:12px;width:100%">Cancel</button>`;
    overlay.appendChild(panel);
    document.body.appendChild(overlay);
    const search = panel.querySelector("#pkSearch");
    const list = panel.querySelector("#pkList");
    const render = (q) => {
      const raw = (q||"").trim();
      const query = raw.toLowerCase();
      const filtered = query ? items.filter(x => x.toLowerCase().includes(query)) : items;
      let html = filtered.length ? filtered.map(x => `<div class="product-item" data-v="${esc(x)}">${esc(x)}</div>`).join("") : `<div class="empty" style="padding:20px">No matches.</div>`;
      if (allowCustom && raw && !items.some(x => x.toLowerCase() === query)) html += `<div class="product-item" data-v="${esc(raw)}" style="border-color:var(--accent);color:var(--accent)">+ Use "${esc(raw)}"</div>`;
      list.innerHTML = html;
      list.querySelectorAll("[data-v]").forEach(el => { el.onclick = () => { cleanup(); resolve(el.getAttribute("data-v")); }; });
    };
    render("");
    search.addEventListener("input", e => render(e.target.value));
    panel.querySelector("#pkCancel").onclick = () => { cleanup(); resolve(null); };
    function cleanup(){ overlay.remove(); }
  });
}
function getPickerSource(source, machineNames, operatorNames){
  if (source === "machines") return machineNames;
  if (source === "operators") return operatorNames;
  if (source === "filling_lines") return FILLING_LINES;
  return [];
}

async function renderTemplate(templateKey){
  const tpl = TEMPLATES[templateKey];
  const c = document.getElementById("module-content");
  c.innerHTML = `<div class="loading">Loading…</div>`;
  try {
    const category = tpl.category || "";
    const [products, machines, operators] = await Promise.all([
      loadProducts(),
      loadMachines(false, category),
      loadOperators(false, category)
    ]);
    const machineNames = machines.map(m => m.name || m);
    const operatorNames = operators.map(o => o.name || o);

    const emptyRow = () => { const row = { product:"", productCode:"" }; tpl.fields.forEach(f => row[f.key] = ""); return row; };
    let entries = [emptyRow()];
    let date = new Date().toISOString().slice(0,10);

    const root = document.createElement("div");
    root.innerHTML = `
      <div class="entry-row"><label>Date</label><input type="date" id="tplDate" value="${date}"/></div>
      <div id="tplEntries"></div>
      <button class="action-btn" id="tplAdd" style="width:100%;margin-bottom:12px">+ Add Another Entry</button>
      <button class="action-btn green" id="tplSave" style="width:100%;margin-bottom:16px">💾 Save & Send</button>
      <div id="tplSync"></div>
      <div id="tplPending"></div>`;
    c.innerHTML = ""; c.appendChild(root);

    const entriesBox = root.querySelector("#tplEntries");
    const syncBox = root.querySelector("#tplSync");
    const pendingBox = root.querySelector("#tplPending");

    const renderSyncBanner = () => {
      const pending = getPending(tpl.storageKey);
      if (pending.length === 0) { syncBox.innerHTML = `<div class="ok-banner">✅ No pending entries. All sent.</div>`; return; }
      syncBox.innerHTML = `<div class="info-banner">${pending.length} pending entr${pending.length===1?"y":"ies"} waiting to sync.<div style="margin-top:10px"><button class="action-btn orange" id="tplSyncNow">🔄 Sync Now</button></div></div>`;
      const btn = syncBox.querySelector("#tplSyncNow");
      if (btn) btn.onclick = async () => { await syncTemplate(tpl); renderSyncBanner(); renderPending(); };
    };

    const renderEntries = () => {
      entriesBox.innerHTML = entries.map((e, i) => {
        const fieldHtml = tpl.fields.map(f => {
          if (f.type === "picker") {
            const picked = e[f.key];
            return `<div class="entry-row"><label>${esc(f.label)}</label>
              <button class="picker-btn" data-field="${i}::${f.key}">${picked ? esc(picked) : "Tap to choose"}</button></div>`;
          }
          return `<div class="entry-row"><label>${esc(f.label)}</label>
            <input data-field="${i}::${f.key}" type="${f.type === "number" ? "number" : "text"}" ${f.type === "number" ? 'inputmode="numeric"' : ''} value="${esc(e[f.key]||"")}" placeholder="${esc(f.placeholder||"")}"/></div>`;
        }).join("");
        return `<div class="entry-card"><h4>Entry ${i+1}${entries.length > 1 ? ` <button class="remove-btn" data-rm="${i}">Remove</button>` : ""}</h4>
          <div class="entry-row"><label>Product</label>
            <button class="picker-btn" data-prod="${i}">${e.product ? esc(e.product) : "Tap to choose product"}</button></div>
          ${fieldHtml}</div>`;
      }).join("");
      bindEntryHandlers();
    };

    const bindEntryHandlers = () => {
      entriesBox.querySelectorAll("[data-prod]").forEach(btn => {
        btn.onclick = async () => {
          const i = +btn.getAttribute("data-prod");
          const names = products.map(p => `${p.code} — ${p.name}`);
          const picked = await openPicker("Choose Product", names, false);
          if (picked) {
            const code = picked.split(" — ")[0];
            const found = products.find(p => p.code === code);
            if (found) { entries[i].product = found.name; entries[i].productCode = found.code; renderEntries(); }
          }
        };
      });
      entriesBox.querySelectorAll("[data-field]").forEach(el => {
        const tag = el.tagName.toLowerCase();
        const attr = el.getAttribute("data-field"); if (!attr) return;
        const [iStr, key] = attr.split("::"); const i = +iStr;
        const fieldDef = tpl.fields.find(f => f.key === key); if (!fieldDef) return;
        if (tag === "button") {
          const source = getPickerSource(fieldDef.source, machineNames, operatorNames);
          el.onclick = async () => {
            const picked = await openPicker("Choose " + fieldDef.label, source, !!fieldDef.allowCustom);
            if (picked) { entries[i][key] = picked; renderEntries(); }
          };
        } else if (tag === "input") {
          el.oninput = ev => { entries[i][key] = ev.target.value; };
          if (key === "batch_no") {
            el.onblur = async ev => {
              const bn = ev.target.value.trim();
              if (!bn) return;
              const hit = await lookupBatch(bn);
              if (hit) {
                const bsInput = entriesBox.querySelector(`[data-field="${i}::batch_size"]`);
                if (bsInput) { bsInput.value = hit.batchSize; entries[i].batch_size = hit.batchSize; }
                if (!entries[i].product && hit.productName) {
                  entries[i].product = hit.productName;
                  entries[i].productCode = hit.productCode;
                  renderEntries();
                }
              }
            };
          }
        }
      });
      entriesBox.querySelectorAll("[data-rm]").forEach(btn => {
        btn.onclick = () => {
          const i = +btn.getAttribute("data-rm"); entries.splice(i, 1);
          if (entries.length === 0) entries.push(emptyRow()); renderEntries();
        };
      });
    };

    const renderPending = () => {
      const pending = getPending(tpl.storageKey);
      if (pending.length === 0) { pendingBox.innerHTML = ""; return; }
      pendingBox.innerHTML = `<div style="color:var(--dim);font-size:12px;margin-top:16px;margin-bottom:8px">Pending entries:</div>` +
        pending.map((p, i) => {
          const lines = [];
          Object.keys(p).forEach(k => { if (k === "Saved At") return; lines.push(`<div><b>${esc(k)}:</b> ${esc(p[k])}</div>`); });
          return `<div class="entry-card"><h4>#${i+1} <button class="remove-btn" data-del="${i}">Delete</button></h4><div style="font-size:13px;line-height:1.6">${lines.join("")}</div></div>`;
        }).join("");
      pendingBox.querySelectorAll("[data-del]").forEach(btn => {
        btn.onclick = () => {
          const i = +btn.getAttribute("data-del"); const list = getPending(tpl.storageKey);
          list.splice(i, 1); savePending(tpl.storageKey, list); renderPending(); renderSyncBanner();
        };
      });
    };

    root.querySelector("#tplAdd").onclick = () => { entries.push(emptyRow()); renderEntries(); };
    root.querySelector("#tplSave").onclick = async () => {
      const d = root.querySelector("#tplDate").value || date;
      const valid = entries.filter(e => {
        if (!e.product) return false;
        return tpl.fields.every(f => String(e[f.key]||"").trim() !== "");
      });
      if (valid.length === 0) { alert("Fill in at least one complete entry.\n\nEvery field is required."); return; }
      const toSave = valid.map(e => tpl.toRow(d, e));
      const existing = getPending(tpl.storageKey);
      savePending(tpl.storageKey, existing.concat(toSave));
      entries = [emptyRow()];
      renderEntries(); renderPending(); renderSyncBanner();
      setStatus("Sending…");
      const r = await syncTemplate(tpl);
      renderSyncBanner(); renderPending();
      if (r.sent > 0 && r.remaining === 0) alert(`✅ ${r.sent} entr${r.sent===1?"y":"ies"} sent.`);
      else if (r.remaining > 0) alert(`⚠️ ${r.remaining} kept on phone. Tap "Sync Now" to retry.`);
    };

    renderEntries(); renderPending(); renderSyncBanner();
    setStatus(tpl.title + " ready");
  } catch(err){
    c.innerHTML = `<div class="err-banner">Failed to load: ${esc(err.message)}</div>
      <button class="back-btn" onclick="goHome()">← Back</button>`;
  }
}

        };
      });
      itemsBox.querySelectorAll("[data-batch]").forEach(inp => { inp.oninput = e => { items[+e.target.getAttribute("data-batch")].batch_no = e.target.value; }; });
      itemsBox.querySelectorAll("[data-qty]").forEach(inp => { inp.oninput = e => { items[+e.target.getAttribute("data-qty")].qty = e.target.value; }; });
      itemsBox.querySelectorAll("[data-rm]").forEach(btn => {
        btn.onclick = () => {
          const i = +btn.getAttribute("data-rm"); items.splice(i, 1);
          if (items.length === 0) items.push(emptyItem()); renderItems();
        };
      });
    };

    const renderPending = () => {
      const pending = getPending(RECEIPT_STORAGE);
      if (pending.length === 0) { pendingBox.innerHTML = ""; return; }
      pendingBox.innerHTML = `<div style="color:var(--dim);font-size:12px;margin-top:16px;margin-bottom:8px">Pending receipt items:</div>` +
        pending.map((p, i) => {
          const lines = [];
          Object.keys(p).forEach(k => { if (k === "Saved At") return; lines.push(`<div><b>${esc(k)}:</b> ${esc(p[k])}</div>`); });
          return `<div class="entry-card"><h4>#${i+1} <button class="remove-btn" data-del="${i}">Delete</button></h4><div style="font-size:13px;line-height:1.6">${lines.join("")}</div></div>`;
        }).join("");
      pendingBox.querySelectorAll("[data-del]").forEach(btn => {
        btn.onclick = () => {
          const i = +btn.getAttribute("data-del"); const list = getPending(RECEIPT_STORAGE);
          list.splice(i, 1); savePending(RECEIPT_STORAGE, list); renderPending(); renderSyncBanner();
        };
      });
    };

    root.querySelector("#rcAdd").onclick = () => { items.push(emptyItem()); renderItems(); };
    root.querySelector("#rcSave").onclick = async () => {
      if (!receivedFrom.trim()) { alert("Please enter who received the items from."); return; }
      const valid = items.filter(it => it.product && it.batch_no && it.qty);
      if (valid.length === 0) { alert("Fill in at least one complete item."); return; }
      const ref = reference.trim() || makeReference();
      const toSave = valid.map(it => ({
        date: date, reference: ref, product: it.product, productCode: it.productCode,
        batchNo: it.batch_no, quantity: it.qty, receivedFrom: receivedFrom, remarks: remarks
      }));
      setStatus("Sending…");
      const resp = await productionSaveReceipt(toSave);
      if (!resp || !resp.ok) {
        alert("⚠️ " + ((resp && resp.error) || "Failed"));
        setStatus("Send failed");
        return;
      }
      items = [emptyItem()]; reference = makeReference();
      root.querySelector("#rcRef").value = reference;
      renderItems(); updateSessionBanner();
      alert(`✅ ${resp.receipts} item(s) saved.\n${resp.productionUpdated} production row(s) updated.`);
      setStatus("Saved");
    };

    renderItems(); renderPending(); renderSyncBanner();
    setStatus("Product Receipt ready");
  } catch(err){
    c.innerHTML = `<div class="err-banner">Failed to load: ${esc(err.message)}</div>
      <button class="back-btn" onclick="goHome()">← Back</button>`;
  }
}

// ============================================================
// DASHBOARD
// ============================================================
async function renderDashboard(){
  const c = document.getElementById("module-content");
  c.innerHTML = `<div class="loading">Building dashboard…</div>`;
  try {
    const month = currentMonthString();
    const today = todayString();
    const startOfWeek = (() => { const d = new Date(); const dow = d.getDay() || 7; d.setDate(d.getDate() - (dow - 1)); return d.toISOString().slice(0,10); })();
    const [packing, filling, shrink, coding, receipt, weighing] = await Promise.all([
      safeFetch("packing_log_" + month),
      safeFetch("filling_log_" + month),
      safeFetch("shrinkwrap_log_" + month),
      safeFetch("coding_log_" + month),
      safeFetch("receipt_log_" + month),
      safeFetch("weighing_log_" + month),
    ]);
    const inRange = (row, from, to) => {
      const d = parseYMD(row["Date"] || row["Saved At"] || row["Logged At"]);
      if (!d) return false;
      const s = d.toISOString().slice(0,10);
      return s >= from && s <= to;
    };
    const num = v => { const n = parseInt(String(v||"").replace(/[^\d-]/g,""), 10); return isNaN(n)?0:n; };

    const todayPacking = packing.filter(r => inRange(r, today, today));
    const todayFilling = filling.filter(r => inRange(r, today, today));
    const todayShrink = shrink.filter(r => inRange(r, today, today));
    const todayCoding = coding.filter(r => inRange(r, today, today));
    const todayReceipt = receipt.filter(r => inRange(r, today, today));
    const todayWeigh = weighing.filter(r => inRange(r, today, today));

    const todayOutput = todayPacking.reduce((s,r) => s + num(r["Output"]), 0) + todayFilling.reduce((s,r) => s + num(r["Daily Output"]), 0);
    const todayDowntimeHrs = todayFilling.reduce((s,r) => s + downtimeToHours(r["Machine Downtime"]), 0);
    const todayEntries = todayPacking.length + todayFilling.length + todayShrink.length + todayCoding.length + todayReceipt.length + todayWeigh.length;

    const lineStats = {}; todayFilling.forEach(r => { const line = String(r["Filling Line"]||"(unset)").trim(); lineStats[line] = (lineStats[line]||0) + num(r["Daily Output"]); });
    const codingStats = {}; todayCoding.forEach(r => { const m = String(r["Machine"]||"(unset)").trim(); codingStats[m] = (codingStats[m]||0) + num(r["Quantity"]); });
    const shrinkStats = {}; todayShrink.forEach(r => { const m = String(r["Machine"]||"(unset)").trim(); shrinkStats[m] = (shrinkStats[m]||0) + num(r["Quantity"]); });

    const weekEntries = packing.filter(r => inRange(r, startOfWeek, today)).length + filling.filter(r => inRange(r, startOfWeek, today)).length + shrink.filter(r => inRange(r, startOfWeek, today)).length + coding.filter(r => inRange(r, startOfWeek, today)).length + receipt.filter(r => inRange(r, startOfWeek, today)).length;
    const weekOutput = packing.filter(r => inRange(r, startOfWeek, today)).reduce((s,r) => s + num(r["Output"]), 0) + filling.filter(r => inRange(r, startOfWeek, today)).reduce((s,r) => s + num(r["Daily Output"]), 0);

    const monthOutput = packing.reduce((s,r) => s + num(r["Output"]), 0) + filling.reduce((s,r) => s + num(r["Daily Output"]), 0);
    const monthEntries = packing.length + filling.length + shrink.length + coding.length + receipt.length + weighing.length;

    const pendingTotal = getPending("afrab.shrink.pending").length + getPending("afrab.coding.pending").length + getPending("afrab.packing.pending").length + getPending("afrab.filling.pending").length + getPending(RECEIPT_STORAGE).length + getPending(WEIGHING_STORAGE).length;

    const listHtml = (obj) => {
      const keys = Object.keys(obj);
      if (!keys.length) return `<div class="list-row"><span class="name">No entries yet today</span></div>`;
      return keys.sort().map(k => `<div class="list-row"><span class="name">${esc(k)}</span><span class="num">${obj[k].toLocaleString()}</span></div>`).join("");
    };

    c.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div style="font-size:12px;color:var(--dim)">As of ${new Date().toLocaleString()}</div>
        <button class="action-btn alt" onclick="renderDashboard()" style="margin:0">🔄 Refresh</button>
      </div>
      <h2>📅 Today · ${esc(today)}</h2>
      <div class="stat-grid">
        <div class="stat-card accent"><div class="stat-label">Total Entries</div><div class="stat-value">${todayEntries}</div></div>
        <div class="stat-card green"><div class="stat-label">Total Output</div><div class="stat-value">${todayOutput.toLocaleString()}</div></div>
        <div class="stat-card orange"><div class="stat-label">Downtime</div><div class="stat-value">${todayDowntimeHrs.toFixed(2)} h</div></div>
        <div class="stat-card purple"><div class="stat-label">Weighing</div><div class="stat-value">${todayWeigh.length}</div></div>
      </div>
      <h2>🏭 Filling Lines Today</h2><div class="list-card">${listHtml(lineStats)}</div>
      <h2>🏷️ Coding Today</h2><div class="list-card">${listHtml(codingStats)}</div>
      <h2>🎞️ Shrinkwrap Today</h2><div class="list-card">${listHtml(shrinkStats)}</div>
      <h2>📆 This Week (from ${esc(startOfWeek)})</h2>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">Entries</div><div class="stat-value">${weekEntries}</div></div>
        <div class="stat-card"><div class="stat-label">Output</div><div class="stat-value">${weekOutput.toLocaleString()}</div></div>
      </div>
      <h2>🗓️ This Month · ${esc(month)}</h2>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">Entries</div><div class="stat-value">${monthEntries}</div></div>
        <div class="stat-card"><div class="stat-label">Output</div><div class="stat-value">${monthOutput.toLocaleString()}</div></div>
      </div>
      <h2>⏳ Pending Sync</h2>
      <div class="list-card">${pendingTotal === 0 ? `<div class="list-row"><span class="name" style="color:var(--green)">✅ All entries synced</span></div>` : `<div class="list-row"><span class="name">Total pending</span><span class="num">${pendingTotal}</span></div>`}</div>`;
    setStatus("Dashboard loaded");
  } catch(err){
    c.innerHTML = `<div class="err-banner">Dashboard failed: ${esc(err.message)}</div>
      <button class="back-btn" onclick="goHome()">← Back</button>`;
  }
}
