<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>AFRAB Operations</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{--bg:#0f172a;--panel:#1e293b;--border:#334155;--text:#e2e8f0;--dim:#94a3b8;--accent:#0ea5e9;--green:#22c55e;--orange:#f59e0b;--red:#ef4444}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100%}
  .screen{display:none;padding:16px 16px 70px 16px}
  .screen.active{display:block}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  h1{font-size:20px;margin:0;color:var(--accent)}
  .role-pill{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer}
  .role-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:20px}
  .role-btn{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;font-size:16px;color:var(--text);text-align:left;cursor:pointer}
  .role-btn:active{transform:scale(.97)}
  .modules{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .module{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 14px;text-align:left;cursor:pointer;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;color:var(--text)}
  .module:active{transform:scale(.97)}
  .module .icon{font-size:26px}
  .module .label{font-size:14px;font-weight:600;margin-top:10px}
  .module .sub{font-size:11px;color:var(--dim);margin-top:4px}
  .module.packing{border-color:#2563eb}.module.filling{border-color:#14b8a6}
  .module.receipt{border-color:#f59e0b}.module.batch{border-color:#8b5cf6}
  .module.shrink{border-color:#ec4899}.module.coding{border-color:#22c55e}
  .module.weighing{border-color:#0ea5e9}.module.admin{border-color:#64748b}

  .product-item{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
  .product-item:active{background:#273449}
  .product-item .code{color:var(--dim);font-size:12px;font-family:monospace}
  .product-item .name{font-size:14px;margin-top:4px}

  .search{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:15px;color:var(--text);margin-bottom:12px}
  .search:focus{outline:none;border-color:var(--accent)}
  .back-btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text);font-size:13px;cursor:pointer;margin-bottom:16px}

  .empty{text-align:center;padding:40px 20px;color:var(--dim);font-size:14px;line-height:1.6}
  .loading{text-align:center;padding:40px 20px;color:var(--dim)}

  .status-bar{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--border);padding:10px 16px;font-size:12px;color:var(--dim);display:flex;justify-content:space-between;z-index:10}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px}
  .dot.offline{background:var(--red)}

  .material-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;border-left:5px solid var(--green)}
  .material-card.warn{border-left-color:var(--orange)}
  .material-card.danger{border-left-color:var(--red)}
  .material-card.expired{border-left-color:#475569;opacity:0.7}

  .mat-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .mat-code{font-family:monospace;color:var(--dim);font-size:12px}
  .mat-name{font-size:15px;font-weight:600;margin:4px 0 10px 0}
  .mat-detail{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
  .mat-label{color:var(--dim)}
  .mat-value{color:var(--text);font-family:monospace}

  .alert-pill{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;margin-top:8px}
  .alert-pill.ok{background:#14532d;color:#86efac}
  .alert-pill.warn{background:#78350f;color:#fdba74}
  .alert-pill.danger{background:#7f1d1d;color:#fecaca}
  .alert-pill.expired{background:#374151;color:#cbd5e1}

  .info-banner{background:#1e3a5f;border:1px solid #0ea5e9;border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:14px;color:#bae6fd}
</style>
</head>
<body>

<div id="screen-role" class="screen active">
  <header><h1>AFRAB Operations</h1></header>
  <p style="color:var(--dim);font-size:14px;margin-bottom:8px">Welcome. Select your role to continue.</p>
  <div class="role-grid" id="role-grid"></div>
</div>

<div id="screen-home" class="screen">
  <header><h1>AFRAB Operations</h1><div class="role-pill" id="role-pill">—</div></header>
  <div class="modules" id="modules"></div>
</div>

<div id="screen-module" class="screen">
  <button class="back-btn" onclick="goHome()">← Back</button>
  <h1 id="module-title" style="margin-bottom:16px">Module</h1>
  <div id="module-content"></div>
</div>

<div class="status-bar">
  <span><span id="net-dot" class="dot"></span><span id="net-text">Online</span></span>
  <span id="status-text">Ready</span>
</div>

<script>
// ============================================================
// YOUR DATA SOURCES
// ============================================================
const SHEET_URLS = {
  products:      "https://docs.google.com/spreadsheets/d/e/2PACX-1vSfTXyBX0S_Q236wARJLe68F1hia2FJZVxt3fV6zPE08ZTIG-GDoUun1l2GEbeG6zSwjarJQUtLrbF8/pub?gid=370230692&single=true&output=csv",
  raw_materials: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSfTXyBX0S_Q236wARJLe68F1hia2FJZVxt3fV6zPE08ZTIG-GDoUun1l2GEbeG6zSwjarJQUtLrbF8/pub?gid=1200469071&single=true&output=csv",
  bom:           "https://docs.google.com/spreadsheets/d/e/2PACX-1vSfTXyBX0S_Q236wARJLe68F1hia2FJZVxt3fV6zPE08ZTIG-GDoUun1l2GEbeG6zSwjarJQUtLrbF8/pub?gid=55512345&single=true&output=csv",
};

// ============================================================
// CORS fallback — direct first, then proxies only if needed
// ============================================================
const PROXIES = [
  url => url, // DIRECT FIRST — this is what works for Products
  url => "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
  url => "https://corsproxy.io/?url=" + encodeURIComponent(url),
];

async function fetchCSV(url){
  let lastErr = null;
  for(const wrap of PROXIES){
    try{
      const finalUrl = wrap(url);
      const r = await fetch(finalUrl, {cache:"no-store"});
      if(!r.ok) throw new Error("HTTP " + r.status);
      const txt = await r.text();
      if(txt && txt.length > 5) return txt;
      throw new Error("Empty response");
    }catch(e){
      lastErr = e;
    }
  }
  throw new Error("Fetch failed: " + (lastErr ? lastErr.message : "unknown"));
}

// ============================================================
// STATE
// ============================================================
const state = {
  role: localStorage.getItem("afrab.role") || null,
  products: [],
  rawMaterials: [],
  bom: [],
};

const ROLES = [
  { id:"packing",  label:"Packing Supervisor",   icon:"🧴" },
  { id:"filling",  label:"Filling Supervisor",   icon:"💧" },
  { id:"receipt",  label:"Product Receiver",     icon:"📥" },
  { id:"batch",    label:"Production Batch",     icon:"📦" },
  { id:"shrink",   label:"Label / Shrinkwrap",   icon:"🎞️" },
  { id:"coding",   label:"Coding Supervisor",    icon:"🏷️" },
  { id:"weighing", label:"Weighing Staff",       icon:"⚖️" },
  { id:"admin",    label:"Admin",                icon:"🔧" },
];

const MODULES = {
  packing:  { title:"Packing Entry",     sub:"Daily packer output",       color:"packing" },
  filling:  { title:"Filling Entry",     sub:"Filling line production",   color:"filling" },
  receipt:  { title:"Product Receipt",   sub:"Receive finished products", color:"receipt" },
  batch:    { title:"Production Batch",  sub:"Track batch by year",       color:"batch" },
  shrink:   { title:"Shrink Wrapping",   sub:"Per machine, per day",      color:"shrink" },
  coding:   { title:"Coding",            sub:"Per coder, per batch",      color:"coding" },
  weighing: { title:"Weighing",          sub:"Raw materials for a batch", color:"weighing" },
  admin:    { title:"Admin",             sub:"Products, machines, etc.",  color:"admin" },
};

const ROLE_MODULES = {
  packing:["packing"], filling:["filling"], receipt:["receipt"],
  batch:["batch"], shrink:["shrink"], coding:["coding"],
  weighing:["weighing"],
  admin:["packing","filling","receipt","batch","shrink","coding","weighing","admin"],
};

// ============================================================
// INIT & NAV
// ============================================================
function init(){ state.role ? showHome() : showRolePicker(); updateNet(); }
function updateNet(){
  const d=document.getElementById("net-dot"), t=document.getElementById("net-text");
  if(navigator.onLine){d.classList.remove("offline");t.textContent="Online";}
  else{d.classList.add("offline");t.textContent="Offline";}
}
addEventListener("online",updateNet);addEventListener("offline",updateNet);

function setStatus(s){document.getElementById("status-text").textContent=s;}
function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0,0);
}

function showRolePicker(){
  const g=document.getElementById("role-grid");g.innerHTML="";
  ROLES.forEach(r=>{
    const b=document.createElement("button");
    b.className="role-btn";b.innerHTML=`${r.icon} &nbsp; ${r.label}`;
    b.onclick=()=>{state.role=r.id;localStorage.setItem("afrab.role",r.id);showHome();};
    g.appendChild(b);
  });
  showScreen("screen-role");
}

function showHome(){
  const role=state.role, info=ROLES.find(r=>r.id===role);
  const pill=document.getElementById("role-pill");
  pill.textContent=info?info.label:"Unknown";
  pill.onclick=()=>{if(confirm("Change role?")){state.role=null;localStorage.removeItem("afrab.role");showRolePicker();}};
  const mods=ROLE_MODULES[role]||[];
  const grid=document.getElementById("modules");grid.innerHTML="";
  mods.forEach(m=>{
    const mi=MODULES[m];
    const t=document.createElement("button");
    t.className=`module ${mi.color}`;
    t.innerHTML=`<div class="icon">${ROLES.find(r=>r.id===m)?.icon||"•"}</div><div><div class="label">${mi.title}</div><div class="sub">${mi.sub}</div></div>`;
    t.onclick=()=>openModule(m);
    grid.appendChild(t);
  });
  showScreen("screen-home");
}

function goHome(){showHome();}

function openModule(id){
  document.getElementById("module-title").textContent=MODULES[id].title;
  const c=document.getElementById("module-content");
  c.innerHTML=`<div class="loading">Loading…</div>`;
  showScreen("screen-module");
  if(id==="admin") renderAdmin();
  else if(id==="weighing") renderWeighingProductPicker();
  else c.innerHTML=`<div class="empty"><b>${MODULES[id].title}</b> — coming next.</div>`;
}

// ============================================================
// CSV PARSER
// ============================================================
function parseCSV(t){
  const rows=[];let cur=[],f="",inq=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(inq){if(c==='"'&&t[i+1]==='"'){f+='"';i++;}else if(c==='"')inq=false;else f+=c;}
    else{if(c==='"')inq=true;else if(c===","){cur.push(f);f="";}
      else if(c==="\n"){cur.push(f);rows.push(cur);cur=[];f="";}
      else if(c!=="\r")f+=c;}}
  if(f||cur.length){cur.push(f);rows.push(cur);}
  if(!rows.length)return{headers:[],rows:[]};
  const headers=rows[0].map(x=>x.trim());
  return {headers, rows: rows.slice(1)};
}

function parseSimpleCSV(t){
  const {headers, rows} = parseCSV(t);
  const out=[];
  for(const r of rows){
    if(!r.length || !r[0]?.trim()) continue;
    const obj = {};
    headers.forEach((hh,i)=>{ obj[hh]=r[i]; });
    out.push(obj);
  }
  return {headers, rows: out};
}

function findCol(headers, ...keywords){
  for(const k of keywords){
    const idx = headers.findIndex(h=>h.toLowerCase().includes(k.toLowerCase()));
    if(idx >= 0) return headers[idx];
  }
  return null;
}

// ============================================================
// LOADERS
// ============================================================
async function loadProducts(){
  if(state.products.length) return state.products;
  const url=SHEET_URLS.products;
  if(!url||url.includes("PASTE_")) throw new Error("Products URL not configured");
  const txt=await fetchCSV(url);
  const {headers, rows} = parseSimpleCSV(txt);
  const cCode = findCol(headers, "product code","code");
  const cName = findCol(headers, "product name","name");
  const cActive = findCol(headers, "active");
  state.products = rows
    .filter(x => x[cCode]?.trim())
    .filter(x => !cActive || (x[cActive]||"").trim().toUpperCase() !== "NO")
    .map(x => ({code:x[cCode].trim(), name:(x[cName]||"").trim()}));
  return state.products;
}

async function loadRawMaterials(){
  if(state.rawMaterials.length) return state.rawMaterials;
  const url=SHEET_URLS.raw_materials;
  if(!url||url.includes("PASTE_")) return [];
  const txt=await fetchCSV(url);
  const {headers, rows} = parseSimpleCSV(txt);
  const cCode  = findCol(headers, "material code");
  const cName  = findCol(headers, "material name");
  const cBatch = findCol(headers, "batch no","batch","lot");
  const cQC    = findCol(headers, "qc");
  const cMFG   = findCol(headers, "mfg","manufactur");
  const cEXP   = findCol(headers, "expir","exp");
  const cStat  = findCol(headers, "status");
  state.rawMaterials = rows
    .filter(x => x[cCode]?.trim())
    .map(x => ({
      code:  (x[cCode]||"").trim(),
      name:  (x[cName]||"").trim(),
      batch: cBatch ? (x[cBatch]||"").trim() : "",
      qc:    (x[cQC]||"").trim(),
      mfg:   (x[cMFG]||"").trim(),
      exp:   (x[cEXP]||"").trim(),
      status: cStat ? (x[cStat]||"").trim() : "Active",
    }));
  return state.rawMaterials;
}

async function loadBOM(){
  if(state.bom.length) return state.bom;
  const url=SHEET_URLS.bom;
  if(!url||url.includes("PASTE_")) return [];
  const txt=await fetchCSV(url);
  const {headers, rows} = parseSimpleCSV(txt);
  const cProd = findCol(headers, "product code","product");
  const cMat  = findCol(headers, "material code","material");
  state.bom = rows
    .filter(x => x[cProd]?.trim() && x[cMat]?.trim())
    .map(x => ({product:(x[cProd]||"").trim(), material:(x[cMat]||"").trim()}));
  return state.bom;
}

// ============================================================
// ADMIN
// ============================================================
async function renderAdmin(){
  const c=document.getElementById("module-content");
  c.innerHTML=`<div class="loading">Loading products…</div>`;
  try{
    const p=await loadProducts();
    setStatus(`${p.length} products loaded`);
    c.innerHTML=`<input class="search" id="prod-search" placeholder="Search products…"/>
      <div style="color:var(--dim);font-size:12px;margin-bottom:10px">${p.length} products</div>
      <div id="prod-list"></div>`;
    const render=(q="")=>{
      const list=document.getElementById("prod-list");
      const query=q.trim().toLowerCase();
      const items=query?p.filter(x=>x.name.toLowerCase().includes(query)||x.code.toLowerCase().includes(query)):p;
      list.innerHTML=items.map(x=>`<div class="product-item"><div class="code">${esc(x.code)}</div><div class="name">${esc(x.name)}</div></div>`).join("");
    };
    render();
    document.getElementById("prod-search").addEventListener("input",e=>render(e.target.value));
  }catch(err){
    c.innerHTML=`<div class="empty">Could not load products.<br><br><b>${esc(err.message)}</b></div>`;
  }
}

// ============================================================
// WEIGHING MODULE
// ============================================================
async function renderWeighingProductPicker(){
  const c=document.getElementById("module-content");
  c.innerHTML=`<div class="loading">Loading products & BOM…</div>`;
  try{
    const [products, raws, bom] = await Promise.all([loadProducts(), loadRawMaterials(), loadBOM()]);
    const productsWithBOM = new Set(bom.map(x=>x.product));

    c.innerHTML=`
      <div class="info-banner">
        ${productsWithBOM.size} of ${products.length} products have a BOM.
      </div>
      <input class="search" id="w-search" placeholder="Search product…"/>
      <div id="w-list"></div>`;

    const render=(q="")=>{
      const list=document.getElementById("w-list");
      const query=q.trim().toLowerCase();
      const items=query?products.filter(x=>x.name.toLowerCase().includes(query)||x.code.toLowerCase().includes(query)):products;
      if(!items.length){list.innerHTML=`<div class="empty">No products match.</div>`;return;}
      list.innerHTML=items.map(p=>{
        const hasBOM = productsWithBOM.has(p.code);
        const badge = hasBOM
          ? `<span style="color:var(--green);font-size:11px">● BOM ready</span>`
          : `<span style="color:var(--dim);font-size:11px">● no BOM</span>`;
        return `<div class="product-item" onclick="showWeighingForProduct('${esc(p.code)}')">
          <div class="code">${esc(p.code)} &nbsp; ${badge}</div>
          <div class="name">${esc(p.name)}</div>
        </div>`;
      }).join("");
    };
    render();
    document.getElementById("w-search").addEventListener("input",e=>render(e.target.value));
  }catch(err){
    c.innerHTML=`<div class="empty">Could not load: <b>${esc(err.message)}</b></div>`;
  }
}

async function showWeighingForProduct(productCode){
  const c=document.getElementById("module-content");
  const product = state.products.find(p=>p.code===productCode);
  const bomItems = state.bom.filter(b=>b.product===productCode);
  const today = new Date();

  const materials = bomItems.map(b=>{
    const matches = state.rawMaterials.filter(r=>r.code===b.material);
    return {materialCode: b.material, records: matches};
  });

  function parseFlexibleDate(str, isExpiry){
    if(!str) return null;
    str = String(str).trim();
    if(!str) return null;

    let m = str.match(/^(\d{4})[-\/](\d{1,2})([-\/](\d{1,2}))?$/);
    if(m){
      const y = parseInt(m[1]);
      const mo = parseInt(m[2]) - 1;
      const d = m[4] ? parseInt(m[4]) : (isExpiry ? new Date(y, mo + 1, 0).getDate() : 1);
      return new Date(y, mo, d);
    }

    m = str.match(/^(\d{1,2})[-\/\.](\d{1,2})[-\/\.](\d{4})$/);
    if(m){
      const d  = parseInt(m[1]);
      const mo = parseInt(m[2]) - 1;
      const y  = parseInt(m[3]);
      return new Date(y, mo, d);
    }

    m = str.match(/^(\d{1,2})[-\/](\d{4})$/);
    if(m){
      const mo = parseInt(m[1]) - 1;
      const y  = parseInt(m[2]);
      const d  = isExpiry ? new Date(y, mo + 1, 0).getDate() : 1;
      return new Date(y, mo, d);
    }

    const months = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
    m = str.match(/^([A-Za-z]{3,})[\s\-\/](\d{4})$/);
    if(m){
      const mo = months[m[1].slice(0,3).toLowerCase()];
      if(mo !== undefined){
        const y = parseInt(m[2]);
        const d = isExpiry ? new Date(y, mo + 1, 0).getDate() : 1;
        return new Date(y, mo, d);
      }
    }

    const native = new Date(str);
    if(!isNaN(native)) return native;
    return null;
  }

  function daysUntil(dateStr){
    const d = parseFlexibleDate(dateStr, true);
    if(!d) return null;
    return Math.floor((d - today) / (1000*60*60*24));
  }

  function statusFor(days, statusText){
    if(statusText && statusText.trim().toLowerCase() === "finished")
      return {cls:"expired", label:"FINISHED", pill:"expired"};
    if(days === null)
      return {cls:"", label:"—", pill:"ok"};
    if(days < 0)
      return {cls:"expired", label:`EXPIRED ${Math.abs(days)} days ago`, pill:"expired"};
    if(days < 30)
      return {cls:"danger", label:`URGENT — ${days} days left`, pill:"danger"};
    if(days < 90)
      return {cls:"warn", label:`${days} days left`, pill:"warn"};
    return {cls:"", label:`${days} days left`, pill:"ok"};
  }

  let html = `
    <button class="back-btn" onclick="renderWeighingProductPicker()">← Products</button>
    <div style="background:var(--panel);border-radius:12px;padding:14px;margin-bottom:16px">
      <div style="font-family:monospace;color:var(--dim);font-size:12px">${esc(product.code)}</div>
      <div style="font-size:17px;font-weight:600;margin-top:4px">${esc(product.name)}</div>
    </div>`;

  if(materials.length === 0){
    html += `<div class="empty"><b>BOM not yet added for this product.</b></div>`;
    c.innerHTML = html;
    return;
  }

  materials.forEach((m, idx)=>{
    html += `<div style="margin-bottom:14px">
      <div style="color:var(--dim);font-size:11px;font-family:monospace;margin-bottom:4px">MATERIAL ${idx+1} of ${materials.length}</div>`;
    
    if(m.records.length === 0){
      html += `<div class="material-card expired">
        <div class="mat-code">${esc(m.materialCode)}</div>
        <div class="mat-name">Not in Raw Materials sheet</div>
      </div>`;
    } else {
      m.records.forEach(rec=>{
        const days = daysUntil(rec.exp);
        const st = statusFor(days, rec.status);
        html += `<div class="material-card ${st.cls}">
          <div class="mat-row">
            <span class="mat-code">${esc(rec.code)}</span>
            <span class="alert-pill ${st.pill}">${st.label}</span>
          </div>
          <div class="mat-name">${esc(rec.name)}</div>
          <div class="mat-detail">
            <span class="mat-label">Batch No:</span><span class="mat-value">${esc(rec.batch||"—")}</span>
            <span class="mat-label">QC No:</span><span class="mat-value">${esc(rec.qc||"—")}</span>
            <span class="mat-label">MFG Date:</span><span class="mat-value">${esc(rec.mfg||"—")}</span>
            <span class="mat-label">Expiry:</span><span class="mat-value">${esc(rec.exp||"—")}</span>
          </div>
        </div>`;
      });
    }
    html += `</div>`;
  });

  c.innerHTML = html;
}

// ============================================================
// UTIL
// ============================================================
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}

init();
</script>
</body>
</html>
